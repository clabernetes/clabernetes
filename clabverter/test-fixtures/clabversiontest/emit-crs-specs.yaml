---
deployment:
  scheduling:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - zone-a
  resources:
    default:
      requests:
        memory: 1Gi
    srl2:
      requests:
        memory: 2Gi
