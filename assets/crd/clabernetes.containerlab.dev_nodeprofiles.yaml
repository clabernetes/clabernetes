                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  launcherImage:
                    description: LauncherImage sets the launcher image to use when
                      spawning the launcher deployments.
                    type: string
                  launcherImagePullPolicy:
                    description: |-
