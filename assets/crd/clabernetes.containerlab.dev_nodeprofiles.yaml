                - slurpeeth
                type: string
              deployment:
                description: |-
                  Deployment holds launcher deployment settings (privileges, persistence, launcher
                  image/log level, containerlab flags, extra env/files) for the selected nodes.
                properties:
                  containerlabDebug:
                    description: ContainerlabDebug sets the `--debug` flag when invoking
                      containerlab in the launcher pods.
                    type: boolean
                  containerlabTimeout:
                    description: |-
                      ContainerlabTimeout sets the `--timeout` flag when invoking containerlab in the launcher
                      pods.
                    type: string
                  containerlabVersion:
                    description: ContainerlabVersion sets a custom version to use
                      for containerlab in the launcher pods.
                    type: string
                  extraEnv:
                    description: ExtraEnv is a list of additional environment variables
                      to set on the launcher container.
