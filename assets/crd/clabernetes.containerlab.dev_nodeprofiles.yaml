                  filesFromConfigMap:
                    description: |-
                      FilesFromConfigMap is a slice of FileFromConfigMap that define the configmap/path and
                      path on the launcher pod that the file should be mounted to.
                    items:
                      description: |-
                        FileFromConfigMap represents a file that you would like to mount (from a configmap) in the
                        launcher pod for a given node.
