---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: launcherprofiles.c9s.run
spec:
  group: c9s.run
  names:
    kind: LauncherProfile
    listKind: LauncherProfileList
    plural: launcherprofiles
    shortNames:
    - c9sprofile
    singular: launcherprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LauncherProfile holds reusable Kubernetes and launcher realization policy for Nodes. A Node
          applies at most one LauncherProfile through spec.launcherProfileRef; fields omitted from the
          profile inherit the global Config defaults.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LauncherProfileSpec is the spec for a LauncherProfile resource.
            properties:
              deployment:
                description: Deployment holds launcher deployment settings.
                properties:
                  persistence:
                    description: Persistence enables persistence of the containerlab
                      working directory.
                    properties:
                      claimSize:
                        description: |-
                          ClaimSize is the size of the PVC for this topology -- if not provided this defaults to 5Gi.
                          If provided, the string value must be a valid kubernetes storage requests style string. Note
                          the claim size *cannot be made smaller* once created, but it *can* be expanded. If you need
                          to make the claim smaller you must delete the topology (or the node from the topology) and
                          re-add it.
                        type: string
                      enabled:
                        description: Enabled indicates whether package-planned persistent
                          artifacts are placed in a mounted PVC.
                        type: boolean
                      storageClassName:
                        description: |-
                          StorageClassName is the storage class to set in the PVC -- if not provided this will be left
                          empty which will end up using your default storage class. Note that currently we assume you
                          have (as default) or provide a dynamically provisionable storage class, hence no selector.
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              expose:
                description: Expose holds configurations relevant to how Nodes using
                  this profile are exposed.
                properties:
                  disableAutoExpose:
                    description: DisableAutoExpose disables automatic exposure of
                      the default port list.
                    type: boolean
                  disableExpose:
                    description: DisableExpose indicates if exposing Nodes via a Service
                      should be disabled.
                    type: boolean
                  exposeType:
                    description: ExposeType configures the Service type used for exposing
                      Nodes.
                    enum:
                    - None
                    - ClusterIP
                    - Headless
                    - LoadBalancer
                    type: string
                  useNodeMgmtIpv4Address:
                    description: UseNodeMgmtIpv4Address assigns a Node's management
                      IPv4 address as its LoadBalancerIP.
                    type: boolean
                  useNodeMgmtIpv6Address:
                    description: UseNodeMgmtIpv6Address assigns a Node's management
                      IPv6 address as its LoadBalancerIP.
                    type: boolean
                type: object
              imagePull:
                description: ImagePull holds configurations relevant to how launcher
                  Pods handle pulling images.
                properties:
                  policy:
                    description: |-
                      Policy is the default Kubernetes pull policy for application containers whose flattened Node
                      definition does not explicitly declare one.
                    enum:
                    - IfNotPresent
                    - Always
                    - Never
                    type: string
                  pullSecrets:
                    description: |-
                      PullSecrets provides same-namespace Docker-config Secrets to the kubelet through
                      Pod.spec.imagePullSecrets. Credentials are not mounted into application containers.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              mgmt:
                description: Mgmt holds shared direct management-overlay allocation
                  policy.
                properties:
                  ipv4-gw:
                    description: IPv4Gw is the IPv4 management gateway.
                    type: string
                  ipv4-range:
                    description: IPv4Range is the IPv4 allocation range within IPv4Subnet.
                    type: string
                  ipv4-subnet:
                    description: IPv4Subnet is the IPv4 management subnet.
                    type: string
                  ipv6-gw:
                    description: IPv6Gw is the IPv6 management gateway.
                    type: string
                  ipv6-range:
                    description: IPv6Range is the IPv6 allocation range within IPv6Subnet.
                    type: string
                  ipv6-subnet:
                    description: IPv6Subnet is the IPv6 management subnet.
                    type: string
                type: object
              resources:
                description: Resources holds the Kubernetes resource requirements
                  for launcher Pods.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              scheduling:
                description: Scheduling holds launcher Pod scheduling settings.
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector sets the node selector that will be configured on all launcher pods for this
                      Topology.
                    type: object
                  tolerations:
                    description: Tolerations is a list of Tolerations that will be
                      set on the launcher pod spec.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              statusProbes:
                description: StatusProbes holds the configurations used to check and
                  report Node status.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled sets the status probes to enabled (or obviously disabled). A Node that has previously
                      started but later fails its readiness check remains running and is reported not ready. A Node
                      that never passes its startup check is restarted after its startup allowance expires.
                    type: boolean
                  excludedNodes:
                    description: |-
                      ExcludedNodes is a set of nodes to be excluded from status probe checking. It may be
                      desirable to exclude some node(s) from status checking due to them not having an easy way
                      for clabernetes to check the state of the node. The node names here should match the name of
                      the nodes in the containerlab sub-topology.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  nodeProbeConfigurations:
                    additionalProperties:
                      description: |-
                        ProbeConfiguration holds optional application-specific probes for a (containerlab) node in a
                        Topology. If both styles are configured, both and the generic nested-container probe must succeed
                        in order to report healthy.
                      properties:
                        sshProbeConfiguration:
                          description: SSHProbeConfiguration defines an SSH probe.
                          properties:
                            password:
                              description: Password is the password to use for auth.
                              type: string
                            port:
                              description: Port is an optional override (of course
                                default is 22).
                              type: integer
                            username:
                              description: Username is the username to use for auth.
                              type: string
                          required:
                          - password
                          - username
                          type: object
                        startupSeconds:
                          description: |-
                            StartupSeconds is the total amount of seconds to allow for the node to start. This defaults
                            to roughly 15 minutes to account for slow-to-boot nodes. The allowance must include time for
                            c9s to pull the image, load it into Docker on the launcher, and boot the node. A larger value
                            does not delay fast nodes because the readiness probe takes over as soon as startup succeeds.
                          type: integer
                        tcpProbeConfiguration:
                          description: TCPProbeConfiguration defines a TCP probe.
                          properties:
                            port:
                              description: |-
                                Port defines the port to try to open a TCP connection to. When using TCP probe setup this
                                connection happens inside the launcher rather than the "normal" k8s style probes. This style
                                probe behaves like a k8s style probe though in that it is "successful" whenever a TCP
                                connection to this port can be opened successfully.
                              type: integer
                          required:
                          - port
                          type: object
                      type: object
                    description: |-
                      NodeProbeConfigurations is a map of node specific probe configurations -- if you only need
                      a simple ssh or tcp connect style setup that works on all node types in the topology you can
                      ignore this and just configure ProbeConfiguration.
                    type: object
                  probeConfiguration:
                    description: ProbeConfiguration is the default probe configuration
                      for the Topology.
                    properties:
                      sshProbeConfiguration:
                        description: SSHProbeConfiguration defines an SSH probe.
                        properties:
                          password:
                            description: Password is the password to use for auth.
                            type: string
                          port:
                            description: Port is an optional override (of course default
                              is 22).
                            type: integer
                          username:
                            description: Username is the username to use for auth.
                            type: string
                        required:
                        - password
                        - username
                        type: object
                      startupSeconds:
                        description: |-
                          StartupSeconds is the total amount of seconds to allow for the node to start. This defaults
                          to roughly 15 minutes to account for slow-to-boot nodes. The allowance must include time for
                          c9s to pull the image, load it into Docker on the launcher, and boot the node. A larger value
                          does not delay fast nodes because the readiness probe takes over as soon as startup succeeds.
                        type: integer
                      tcpProbeConfiguration:
                        description: TCPProbeConfiguration defines a TCP probe.
                        properties:
                          port:
                            description: |-
                              Port defines the port to try to open a TCP connection to. When using TCP probe setup this
                              connection happens inside the launcher rather than the "normal" k8s style probes. This style
                              probe behaves like a k8s style probe though in that it is "successful" whenever a TCP
                              connection to this port can be opened successfully.
                            type: integer
                        required:
                        - port
                        type: object
                    type: object
                type: object
            type: object
          status:
            description: LauncherProfileStatus is the status for a LauncherProfile
              resource.
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
