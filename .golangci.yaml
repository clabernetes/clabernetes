---
version: "2"
run:
  go: "1.26"
linters:
  default: all
  disable:
    - containedctx
    - contextcheck # probably should not ignore but... old cruft and its working fine :)
    - cyclop # already using gocyclo, and its good enough!
    - depguard
    - exhaustruct
    - exhaustruct_v5 # successor of exhaustruct (golangci-lint v2.13+), disabled likewise
    - gomodguard # deprecated, gomodguard_v2 included in all ofc
    - ireturn
    - musttag # also probably should remove but... for now
    - noinlineerr # contradicts gocritic sloppyReassign on guard-style code; inline error guards are idiomatic here
    - nonamedreturns
    - paralleltest
    - protogetter
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl # deprecated, wsl_v5 included in all ofc
    - wsl_v5 # successor of wsl (golangci-lint v2.13+), disabled likewise
  settings:
    funlen:
      lines: 150
      statements: 50
    gocritic:
      disabled-checks:
        - whyNoLint
        # normalized plan/input values are deliberately passed and ranged by value: immutability
        # of the accepted inputs is a design invariant of the record/replay architecture.
        - hugeParam
        - rangeValCopy
        # inline error guards are the codebase idiom (see the noinlineerr disable); sloppyReassign
        # demands the opposite rewrite, and unnamedResult fights compact typed tuples.
        - sloppyReassign
        - unnamedResult
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 15
    importas:
      alias:
        - pkg: k8s.io/client-go/dynamic/(\w+)
          alias: clientgo$1
        - pkg: sigs.k8s.io/controller-runtime
          alias: ctrlruntime
        - pkg: sigs.k8s.io/controller-runtime/pkg/(\w+)
          alias: ctrlruntime$1
        - pkg: sigs.k8s.io/controller-runtime/pkg/controller/controllerutil
          alias: ctrlruntimeutil
        - pkg: k8s.io/api/(\w+)/(\w+)
          alias: k8s$1$2
        - pkg: k8s.io/apimachinery/pkg/types
          alias: apimachinerytypes
        - pkg: k8s.io/apimachinery/pkg/apis/(\w+)/(\w+)
          alias: $1$2
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apimachineryerrors
        - pkg: k8s.io/apimachinery/pkg/runtime
          alias: apimachineryruntime
        - pkg: k8s.io/apimachinery/pkg/runtime/scheme
          alias: apimachineryruntimescheme
        - pkg: github.com/clabernetes/clabernetes/(\w+)
          alias: clabernetes$1
        - pkg: github.com/clabernetes/clabernetes/(\w+)/(\w+)
          alias: clabernetes$1$2
        - pkg: github.com/clabernetes/clabernetes/(\w+)/(\w+)/(\w+)
          alias: clabernetes$1$2$3
      no-unaliased: true
    lll:
      line-length: 100
      tab-width: 4
    staticcheck:
      checks:
        - -ST1000
  exclusions:
    rules:
      # a machine-readable suppression directive with its mandatory reason must never force a
      # line wrap that would detach it from the statement it covers.
      - linters:
          - lll
        source: "//nolint:"
      # a struct field with its serialization tag is one indivisible declaration.
      - linters:
          - lll
        source: "json:\""
      - linters:
          - dupl
          - funlen
          - gochecknoglobals
          - goconst
          - lll
          - maintidx
          - mnd
          - structcheck
          - unparam
          - unused
        path: _test\.go
      - linters:
          - revive
        path: logging/fake.go
      - linters:
          - gochecknoglobals
        text: schemeBuilder is a global variable
      - linters:
          - gochecknoglobals
        text: localSchemeBuilder is a global variable
      - linters:
          - gochecknoglobals
        text: SchemeGroupVersion is a global variable
      - linters:
          - gochecknoglobals
        text: AddToScheme is a global variable
      - linters:
          - revive
        text: package-comments
      - linters:
          - lll
        source: kubebuilder
      - linters:
          - perfsprint
        text: can be replaced with string concatenation
      - linters:
          - revive
        path: util/
        text: meaningless package names
      - linters:
          - revive
        path: util/containerlab/
        text: should have comment
    paths:
      - .private
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
