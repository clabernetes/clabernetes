apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: NodeProfile
metadata:
  labels:
    clabernetes/app: clabernetes
    clabernetes/name: topology-basic
    clabernetes/topologyKind: containerlab
    clabernetes/topologyOwner: topology-basic
  name: topology-basic
  namespace: NAMESPACE
  ownerReferences:
    - apiVersion: clabernetes.containerlab.dev/v1alpha1
      kind: Topology
      name: topology-basic
spec:
  connectivity: vxlan
  expose:
    disableAutoExpose: false
    disableExpose: false
    exposeType: LoadBalancer
    useNodeMgmtIpv4Address: false
    useNodeMgmtIpv6Address: false
  nodeSelector:
    matchLabels:
      clabernetes/topologyOwner: topology-basic
  statusProbes:
    enabled: false
    probeConfiguration:
      startupSeconds: 0
status: {}
