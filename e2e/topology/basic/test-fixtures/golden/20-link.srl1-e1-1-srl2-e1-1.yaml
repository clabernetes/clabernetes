apiVersion: c9s.run/v1alpha1
kind: Link
metadata:
  labels:
    c9s.run/app: clabernetes
    c9s.run/name: srl1-e1-1-srl2-e1-1
    c9s.run/topologyKind: containerlab
    c9s.run/topologyOwner: topology-basic
  name: srl1-e1-1-srl2-e1-1
  namespace: NAMESPACE
  ownerReferences:
    - apiVersion: c9s.run/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: Topology
      name: topology-basic
spec:
  endpointA:
    interfaceName: e1-1
    nodeName: srl1
  endpointB:
    interfaceName: e1-1
    nodeName: srl2
status:
  resolvedEndpoints:
    endpointA:
      nodeName: srl1
    endpointB:
      nodeName: srl2
  tunnelID: 1
