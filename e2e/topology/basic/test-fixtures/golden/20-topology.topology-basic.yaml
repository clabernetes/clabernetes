apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: Topology
metadata:
  annotations: {}
  name: topology-basic
  namespace: NAMESPACE
spec:
  connectivity: vxlan
  definition:
    containerlab: |-
      name: topology-basic

      topology:
        nodes:
          srl1:
            kind: srl
            image: ghcr.io/nokia/srlinux
          srl2:
            kind: srl
            image: ghcr.io/nokia/srlinux
        links:
          - endpoints: ["srl1:e1-1", "srl2:e1-1"]
          - endpoints: ["srl1:e1-3", "host:eth13"]
  deployment:
    containerlabTimeout: ""
    persistence:
      enabled: false
    scheduling: {}
  expose:
    disableAutoExpose: false
    disableExpose: false
    exposeType: LoadBalancer
  imagePull: {}
  naming: global
  statusProbes:
    enabled: false
    probeConfiguration:
      startupSeconds: 0
status:
  kind: containerlab
  linkCount: 2
  nodeCount: 2
