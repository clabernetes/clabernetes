name: planner-pool-mixed

topology:
  nodes:
    srl:
      kind: nokia_srlinux
      image: ghcr.io/clab-labs/srlinux:25.10.1
      startup-config: |
        set / interface ethernet-1/1 admin-state enable
        set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
        set / interface ethernet-1/1 subinterface 0 ipv4 address 10.210.1.1/30
        set / interface ethernet-1/2 admin-state enable
        set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
        set / interface ethernet-1/2 subinterface 0 ipv4 address 10.210.2.1/30
        set / interface ethernet-1/3 admin-state enable
        set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
        set / interface ethernet-1/3 subinterface 0 ipv4 address 10.210.7.1/30
        set / interface ethernet-1/4 admin-state enable
        set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable
        set / interface ethernet-1/4 subinterface 0 ipv4 address 10.210.8.1/30
        set / network-instance default interface ethernet-1/1.0
        set / network-instance default interface ethernet-1/2.0
        set / network-instance default interface ethernet-1/3.0
        set / network-instance default interface ethernet-1/4.0
    ceos:
      kind: arista_ceos
      image: ghcr.io/clab-labs/ceos:4.33.1F
      startup-config: |
        interface Ethernet1
           no switchport
           ip address 10.210.3.1/30
           no shutdown
        interface Ethernet2
           no switchport
           ip address 10.210.4.1/30
           no shutdown
        interface Ethernet3
           no switchport
           ip address 10.210.7.2/30
           no shutdown
        interface Ethernet4
           no switchport
           ip address 10.210.9.1/30
           no shutdown
        end
    sros:
      kind: nokia_srsim
      image: ghcr.io/clab-labs/nokia_srsim:26.7.R1
      type: sr-1-92s
      license: /opt/nokia/sros/license.txt
      components:
        - slot: A
        - slot: 1
      startup-config: |
        /configure port 1/1/c23 connector breakout c4-100g
        /configure port 1/1/c23 admin-state enable
        /configure port 1/1/c23/1 ethernet mode hybrid
        /configure port 1/1/c23/1 admin-state enable
        /configure port 1/1/c23/2 ethernet mode hybrid
        /configure port 1/1/c23/2 admin-state enable
        /configure port 1/1/c23/3 ethernet mode hybrid
        /configure port 1/1/c23/3 admin-state enable
        /configure port 1/1/c23/4 ethernet mode hybrid
        /configure port 1/1/c23/4 admin-state enable
        /configure router "Base" interface "to-mt-1" port 1/1/c23/1:0
        /configure router "Base" interface "to-mt-1" ipv4 primary address 10.210.5.1
        /configure router "Base" interface "to-mt-1" ipv4 primary prefix-length 30
        /configure router "Base" interface "to-mt-2" port 1/1/c23/2:0
        /configure router "Base" interface "to-mt-2" ipv4 primary address 10.210.6.1
        /configure router "Base" interface "to-mt-2" ipv4 primary prefix-length 30
        /configure router "Base" interface "to-srl" port 1/1/c23/3:0
        /configure router "Base" interface "to-srl" ipv4 primary address 10.210.8.2
        /configure router "Base" interface "to-srl" ipv4 primary prefix-length 30
        /configure router "Base" interface "to-ceos" port 1/1/c23/4:0
        /configure router "Base" interface "to-ceos" ipv4 primary address 10.210.9.2
        /configure router "Base" interface "to-ceos" ipv4 primary prefix-length 30
    mt-srl:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip address replace 10.210.1.2/30 dev eth1
        - ip address replace 10.210.2.2/30 dev eth2
        - ip address replace 10.210.10.1/30 dev eth3
        - ip address replace 10.210.12.2/30 dev eth4
    mt-ceos:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip address replace 10.210.3.2/30 dev eth1
        - ip address replace 10.210.4.2/30 dev eth2
        - ip address replace 10.210.10.2/30 dev eth3
        - ip address replace 10.210.11.1/30 dev eth4
    mt-sros:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip address replace 10.210.5.2/30 dev eth1
        - ip address replace 10.210.6.2/30 dev eth2
        - ip address replace 10.210.11.2/30 dev eth3
        - ip address replace 10.210.12.1/30 dev eth4

  # Every node has four data interfaces. Each router has two parallel links to its multitool.
  links:
    - endpoints: ["srl:e1-1", "mt-srl:eth1"]
    - endpoints: ["srl:e1-2", "mt-srl:eth2"]
    - endpoints: ["ceos:eth1", "mt-ceos:eth1"]
    - endpoints: ["ceos:eth2", "mt-ceos:eth2"]
    - endpoints: ["sros:1/1/c23/1", "mt-sros:eth1"]
    - endpoints: ["sros:1/1/c23/2", "mt-sros:eth2"]
    - endpoints: ["srl:e1-3", "ceos:eth3"]
    - endpoints: ["srl:e1-4", "sros:1/1/c23/3"]
    - endpoints: ["ceos:eth4", "sros:1/1/c23/4"]
    - endpoints: ["mt-srl:eth3", "mt-ceos:eth3"]
    - endpoints: ["mt-ceos:eth4", "mt-sros:eth3"]
    - endpoints: ["mt-sros:eth4", "mt-srl:eth4"]
    # The test adds srl:e1-5 <-> ceos:eth5 only after this baseline passes traffic checks.
