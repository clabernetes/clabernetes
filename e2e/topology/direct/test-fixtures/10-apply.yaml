---
apiVersion: c9s.run/v1alpha1
kind: NodeProfile
metadata:
  name: direct
spec:
  expose:
    disableAutoExpose: true
---
apiVersion: c9s.run/v1alpha1
kind: Link
metadata:
  name: srl1-e1-1-srl2-e1-1
spec:
  endpointA:
    nodeName: srl1
    interfaceName: e1-1
    ipv4: 192.168.0.1/29
    ipv6: 2001:db8:168::/127
  endpointB:
    nodeName: srl2
    interfaceName: e1-1
    ipv4: 192.168.0.2/29
    ipv6: 2001:db8:168::1/127
---
apiVersion: c9s.run/v1alpha1
kind: Node
metadata:
  name: srl1
  labels:
    c9s.run/mode: direct
spec:
  kind: nokia_srlinux
  image: ghcr.io/nokia/srlinux
  profileRef:
    name: direct
  config:
    vars:
      system:
        location: config-vars-rendered-srl1
  startup-config: |
    set / system information location {{ index (index .Config.Vars "system") "location" }}
    set / network-instance default
    set / network-instance default interface ethernet-1/1.0
---
apiVersion: c9s.run/v1alpha1
kind: Node
metadata:
  name: srl2
  labels:
    c9s.run/mode: direct
spec:
  kind: nokia_srlinux
  image: ghcr.io/nokia/srlinux
  profileRef:
    name: direct
  startup-config: |
    set / network-instance default
    set / network-instance default interface ethernet-1/1.0
