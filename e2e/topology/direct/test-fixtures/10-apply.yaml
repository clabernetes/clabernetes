---
apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: Node
metadata:
  name: srl1
  labels:
    c9s: direct
spec:
  kind: nokia_srlinux
  image: ghcr.io/nokia/srlinux
---
apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: Node
metadata:
  name: srl2
  labels:
    c9s: direct
spec:
  kind: nokia_srlinux
  image: ghcr.io/nokia/srlinux
---
apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: Link
metadata:
  name: srl1-e1-1-srl2-e1-1
spec:
  endpointA:
    nodeName: srl1
    interfaceName: e1-1
  endpointB:
    nodeName: srl2
    interfaceName: e1-1
---
apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: NodeProfile
metadata:
  name: direct
spec:
  nodeSelector:
    matchLabels:
      c9s: direct
  expose:
    disableAutoExpose: true
