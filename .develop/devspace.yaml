---
# DevSpace config for `make dev`. See README.md in this directory for registry modes,
# image URLs (localhost:<nodePort>), scripts, and troubleshooting.
version: v2beta1
name: clabernetes

vars:
  REGISTRY:
    source: env
    default: ghcr.io/clabernetes/clabernetes

  # The Makefile exports the pinned kubectl it downloads; standalone devspace runs fall back to
  # whatever is on PATH.
  KUBECTL:
    source: env
    default: kubectl

  # DevSpace runs command-backed variables relative to this config directory. The detector reads
  # node OS/architecture values from the current kubectl context and fails on mixed platforms.
  DETECTED_TARGET_PLATFORM:
    source: command
    command: bash
    args:
      - target-platform.sh

  # TARGET_PLATFORM from the environment overrides detection. Every BuildKit image below receives
  # this value as --platform=<os>/<architecture>.
  TARGET_PLATFORM:
    source: env
    default: ${DETECTED_TARGET_PLATFORM}

  PULL_POLICY: IfNotPresent

  CLABERNETES: clabernetes
  IMAGE_BASE: ${REGISTRY}/${CLABERNETES}
  MANAGER_IMAGE: ${REGISTRY}/${CLABERNETES}-manager
  MANAGER_DEV_IMAGE: ${MANAGER_IMAGE}-dev
  CLABVERTER_IMAGE: ${REGISTRY}/clabverter
  DEV_IMAGE_TAG: dev-latest
  # DevSpace strips tags from devImage when it matches images.*.image; keep the tag on the
  # image name itself so the dev pod pulls an image that actually exists.
  MANAGER_IMAGE_TAGGED:
    source: command
    command: bash
    args:
      - -c
      - printf '%s:%s' "${MANAGER_IMAGE}" "${DEV_IMAGE_TAG}"
  MANAGER_DEV_IMAGE_TAGGED:
    source: command
    command: bash
    args:
      - -c
      - printf '%s:%s' "${MANAGER_DEV_IMAGE}" "${DEV_IMAGE_TAG}"
  LOCAL_MANAGER_IMAGE:
    source: command
    command: bash
    args:
      - local-registry-image-ref.sh
      - ${MANAGER_IMAGE}
      - ${DEV_IMAGE_TAG}
  LOCAL_MANAGER_DEV_IMAGE:
    source: command
    command: bash
    args:
      - local-registry-image-ref.sh
      - ${MANAGER_DEV_IMAGE}
      - ${DEV_IMAGE_TAG}
  # always build w/ 0.0.0 -- overridden for actual releases by release profile. for "normal" builds
  # (not releases) we'll do VERSION-HASH, for releases we'll just override to have version tag.
  VERSION: 0.0.0
  COMMIT_HASH: $(git describe --always --abbrev=8)

  # to be set in ci
  RELEASE_VERSION: ""

  CLABERNETES_DEV_DOMAIN:
    source: env
    default: containerlab.dev

localRegistry:
  enabled: false

images:
  clabernetes-dev:
    createPullSecret: false
    image: ${MANAGER_DEV_IMAGE}
    context: ../
    dockerfile: dev.Dockerfile
    rebuildStrategy: ignoreContextChanges
    buildKit:
      command: ["docker", "buildx"]
      args:
        - "--platform=${TARGET_PLATFORM}"
    tags:
      - ${COMMIT_HASH}
      - dev-latest

  clabernetes:
    createPullSecret: false
    image: ${MANAGER_IMAGE}
    context: ../
    dockerfile: ../build/manager.Dockerfile
    rebuildStrategy: ignoreContextChanges
    buildArgs:
      VERSION: ${VERSION}-${COMMIT_HASH}
    buildKit:
      command: ["docker", "buildx"]
      args:
        - "--platform=${TARGET_PLATFORM}"
    tags:
      - ${COMMIT_HASH}
      - dev-latest

  clabverter:
    createPullSecret: false
    image: ${CLABVERTER_IMAGE}
    context: ../
    dockerfile: ../build/clabverter.Dockerfile
    rebuildStrategy: ignoreContextChanges
    buildArgs:
      VERSION: ${VERSION}-${COMMIT_HASH}
    buildKit:
      command: ["docker", "buildx"]
      args:
        - "--platform=${TARGET_PLATFORM}"
    tags:
      - dev-latest
      - ${COMMIT_HASH}

deployments:
  clabernetes:
    helm:
      displayOutput: true
      chart:
        name: ../charts/clabernetes
      values:
        manager:
          image: ${MANAGER_IMAGE_TAGGED}
          imagePullPolicy: ${PULL_POLICY}
        globalConfig:
          # The development deployment is declarative: it must replace settings left by an
          # earlier checkout/release so the synced manager never runs an incompatible config.
          mergeMode: overwrite
          imagePull:
            criKindOverride: containerd
        clicker:
          image: ${MANAGER_IMAGE_TAGGED}
          imagePullPolicy: ${PULL_POLICY}

dev:
  clabernetes:
    labelSelector:
      c9s.run/app: clabernetes
      c9s.run/component: manager
    container: manager
    devImage: ${MANAGER_DEV_IMAGE_TAGGED}
    sync:
      - path: ../.develop/:/clabernetes/.develop/
        disableDownload: true
      - path: ../:/clabernetes/
        disableDownload: true
        excludeFile: .dockerignore
    terminal:
      command: .develop/start.sh

profiles:
  - name: debug
    patches:
      - op: add
        path: deployments.clabernetes.helm.values.manager.managerLogLevel
        value: debug
      - op: add
        path: deployments.clabernetes.helm.values.manager.controllerLogLevel
        value: debug

  - name: single-manager
    patches:
      - op: add
        path: deployments.clabernetes.helm.values.manager.replicaCount
        value: 1

  - name: auto-run-manager
    patches:
      - op: replace
        path: dev.clabernetes.terminal.command
        value: .develop/start.sh --run

  # In-cluster registry: make dev creates the registry before DevSpace starts. Builds use docker
  # buildx via build-for-local-registry.sh, while the command-backed image refs below point Helm
  # and the dev pod at the registry managed by this project.
  - name: local-registry
    patches:
      - op: replace
        path: dev.clabernetes.devImage
        value: ${LOCAL_MANAGER_DEV_IMAGE}
      - op: replace
        path: deployments.clabernetes.helm.values.manager.image
        value: ${LOCAL_MANAGER_IMAGE}
      - op: replace
        path: deployments.clabernetes.helm.values.clicker.image
        value: ${LOCAL_MANAGER_IMAGE}
      - op: remove
        path: images.clabernetes-dev.buildKit
      - op: add
        path: images.clabernetes-dev.skipPush
        value: true
      - op: add
        path: images.clabernetes-dev.custom
        value:
          command: LOCAL_REGISTRY_BUILD=1 bash build-for-local-registry.sh ${runtime.images.clabernetes-dev.image} ${runtime.images.clabernetes-dev.tag} .develop/dev.Dockerfile .
      - op: remove
        path: images.clabernetes.buildKit
      - op: remove
        path: images.clabernetes.buildArgs
      - op: add
        path: images.clabernetes.skipPush
        value: true
      - op: add
        path: images.clabernetes.custom
        value:
          command: LOCAL_REGISTRY_BUILD=1 bash build-for-local-registry.sh ${runtime.images.clabernetes.image} ${runtime.images.clabernetes.tag} build/manager.Dockerfile .

  # LOCAL_REGISTRY=0: buildx pushes to REGISTRY (e.g. GHCR). Force rebuild/push every run because
  # ignoreContextChanges would skip builds when images exist locally but not in the remote registry.
  - name: external-registry
    patches:
      - op: replace
        path: pipelines.dev.run
        value: |-
          build_images --force-rebuild clabernetes-dev clabernetes
          create_deployments --all
          start_dev --all
      - op: replace
        path: deployments.clabernetes.helm.values.manager.imagePullPolicy
        value: Always
      - op: replace
        path: deployments.clabernetes.helm.values.clicker.imagePullPolicy
        value: Always

  # for development using devspace on "non-local" clusters (meaning *not* kind/docker-desktop/
  # minikube/maybe others) you will want to have Always for image pull so manager and clicker pick
  # up the new image; conversely, for the "local" clusters you *don't* want this because you want
  # to use the image that you loaded (i.e `kind load docker-image`) to the cluster.
  - name: always-pull
    patches:
      - op: replace
        path: deployments.clabernetes.helm.values.manager.imagePullPolicy
        value: Always
      - op: replace
        path: deployments.clabernetes.helm.values.clicker.imagePullPolicy
        value: Always

  - name: release
    patches:
      - op: replace
        path: images.clabernetes.tags
        value:
          - latest
          - ${RELEASE_VERSION}
          - ${COMMIT_HASH}
      - op: replace
        path: images.clabernetes.buildArgs.VERSION
        value: ${RELEASE_VERSION}

      - op: replace
        path: images.clabverter.tags
        value:
          - latest
          - ${RELEASE_VERSION}
          - ${COMMIT_HASH}
      - op: replace
        path: images.clabverter.buildArgs.VERSION
        value: ${RELEASE_VERSION}

  # custom-release is used for "one off" releases where we want to build and push images with some
  # tag that is not one of the normal tags -- something like "0.0.0-customFixTest1"
  - name: custom-release
    patches:
      - op: replace
        path: images.clabernetes.tags
        value:
          - ${RELEASE_VERSION}
      - op: replace
        path: images.clabernetes.buildArgs.VERSION
        value: ${RELEASE_VERSION}

      - op: replace
        path: images.clabverter.tags
        value:
          - ${RELEASE_VERSION}
      - op: replace
        path: images.clabverter.buildArgs.VERSION
        value: ${RELEASE_VERSION}

pipelines:
  build:
    # override the default build pipeline so we don't bother building dev image in ci
    run: |
      build_images clabernetes clabverter

  dev:
    # override the default dev pipeline to not bother building clabverter while doing dev things
    run: |
      build_images clabernetes-dev clabernetes
      create_deployments --all
      start_dev --all

  deploy:
    # override the default dev pipeline to not bother building clabverter or dev image while doing
    # deploy pipeline
    run: |
      run_dependencies --all
      build_images clabernetes
      create_deployments --all

  purge:
    run: |-
      stop_dev --all
      purge_deployments --all
      ${KUBECTL} delete deploy,svc registry -n ${DEVSPACE_NAMESPACE} --ignore-not-found
      ${KUBECTL} delete leases -n ${DEVSPACE_NAMESPACE} \
        $(${KUBECTL} get leases -n ${DEVSPACE_NAMESPACE} 2> /dev/null | grep "clabernetes" | awk '{print $1}') 2> /dev/null || true
      ${KUBECTL} delete crds \
        $(${KUBECTL} get crds 2> /dev/null | grep "clabernetes" | awk '{print $1}') 2> /dev/null || true
