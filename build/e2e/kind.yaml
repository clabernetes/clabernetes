---
# Single-stack, multi-worker KinD config used by the e2e flow (`make
# test-e2e-local` and CI). Two schedulable workers are required for direct-runtime
# connectivity and rescheduling evidence; no UI port mapping or MetalLB is needed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
