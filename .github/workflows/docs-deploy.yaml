---
name: docs-deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: true
      deploy-message:
        description: "Wrangler deploy message"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          fetch-depth: 0

      - name: pull git lfs assets
        run: git lfs pull

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: validate documentation
        run: make check-docs

      - name: build documentation
        run: make build-docs

      - name: deploy production documentation
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --message "${{ inputs.deploy-message }}"
