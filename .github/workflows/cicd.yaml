---
name: cicd

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  file-changes:
    uses: ./.github/workflows/file-changes.yaml

  docs:
    needs: file-changes
    if: needs.file-changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: validate documentation
        run: make check-docs

  lint:
    needs: file-changes
    if: needs.file-changes.outputs.code == 'true'
    uses: ./.github/workflows/lint.yaml

  unit:
    needs: file-changes
    if: needs.file-changes.outputs.code == 'true'
    uses: ./.github/workflows/unit.yaml

  e2e:
    needs:
      - file-changes
      - unit
    if: needs.file-changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit

  # PRs never push images, so build both platforms alongside e2e to prove the builds still work.
  images:
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - lint
      - unit
    uses: ./.github/workflows/images.yaml
    with:
      push: false
      build-version: 0.0.0-${{ github.sha }}
    secrets: inherit

  publish-dev:
    if: ${{ github.event_name == 'push' }}
    needs:
      - lint
      - unit
      - e2e
    uses: ./.github/workflows/publish-dev.yaml
    with:
      channel: main
    secrets: inherit
