---
name: cicd

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read
  packages: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  unit:
    uses: ./.github/workflows/unit.yaml

  e2e:
    needs: unit
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit

  # PRs never push images, so build them alongside e2e purely to prove the builds still work.
  # amd64 alone is enough of a smoke test there; arm64 builds are covered on main.
  images:
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - lint
      - unit
    uses: ./.github/workflows/images.yaml
    with:
      push: false
      amd64-only: true
      build-version: 0.0.0-${{ github.sha }}
    secrets: inherit

  publish-dev:
    if: ${{ github.event_name == 'push' }}
    needs:
      - lint
      - unit
      - e2e
    uses: ./.github/workflows/publish-dev.yaml
    with:
      channel: main
    secrets: inherit
