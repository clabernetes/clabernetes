---
name: migrate-ghcr

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "list matching tags without copying them"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: install oras
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: migrate release and channel tags
        run: bash hack/migrate-ghcr.sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      - name: publish Artifact Hub repository metadata
        if: ${{ inputs.dry_run == false }}
        run: |
          oras push ghcr.io/clabernetes/clabernetes/clabernetes:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/clabernetes/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: record manual follow-up
        if: ${{ inputs.dry_run == false }}
        run: |
          {
            echo "## GHCR migration follow-up"
            echo
            echo "Verify that all six migrated packages are linked to this repository and publicly visible."
            echo "GitHub does not provide an API for changing organization package visibility."
          } >> "$GITHUB_STEP_SUMMARY"
