---
name: e2e

on:
  workflow_call:
    inputs:
      debug:
        description: "start tmate before e2e tests"
        type: boolean
        required: false
        default: false
    secrets:
      SRSIM_LICENSE:
        description: "Nokia SR-SIM license used by the SR-SIM E2E topology"
        required: false

jobs:
  build-image:
    name: build e2e manager image
    runs-on: ubuntu-latest
    outputs:
      srsim-enabled: ${{ steps.srsim.outputs.enabled }}
    env:
      SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: pull git lfs assets
        run: git lfs pull

      - name: load env vars for workflow run
        run: cat .github/vars.env >> "$GITHUB_ENV"

      - name: check SR-SIM availability
        id: srsim
        run: |
          if [[ -n "${SRSIM_LICENSE//[[:space:]]/}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: build manager image once
        run: |
          C9S_LOCAL_BUILD_ID="local-${GITHUB_SHA::8}" make build-manager IMAGE_TAG="local-${GITHUB_SHA::8}"
          docker save --output "$RUNNER_TEMP/manager.tar" \
            "ghcr.io/clabernetes/clabernetes/clabernetes-manager:local-${GITHUB_SHA::8}"

      - name: share manager image with test jobs
        uses: actions/upload-artifact@v7
        with:
          name: e2e-manager-image
          path: ${{ runner.temp }}/manager.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    name: ${{ matrix.suite }}
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: basic topology
            package: ./e2e/topology/basic
            tests: ^Test
          - suite: direct runtime
            package: ./e2e/topology/direct
            tests: ^Test(Direct.*|NodeLinkDirect|LinuxDataplaneDirect|LinuxWithoutManagement|ExposeRequestsManagementAddress|MultiWorkerRecoveryDirect)$
          - suite: planner pool
            package: ./e2e/topology/direct
            tests: ^Test(PlannerPoolReuseAndRecovery|PlannerPoolDelayedPeerStartup|GlobalBatchCleanup)$
          - suite: startup admission
            package: ./e2e/topology/direct
            tests: ^TestStartupPerHostAdmission$
          - suite: SR-SIM
            package: ./e2e/topology/srsim
            tests: ^TestSRSimBootsAndReachesLinux$
    uses: ./.github/workflows/e2e-suite.yaml
    with:
      suite: ${{ matrix.suite }}
      package: ${{ matrix.package }}
      tests: ${{ matrix.tests }}
      srsim-enabled: ${{ needs.build-image.outputs.srsim-enabled == 'true' }}
      debug: ${{ inputs.debug }}
    secrets: inherit

  try-smoke:
    runs-on: ubuntu-latest
    # This job owns a separate KinD cluster and runs independently of the functional tests.
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: pull git lfs assets
        run: git lfs pull

      - name: load env vars for workflow run
        run: cat .github/vars.env >> "$GITHUB_ENV"

      - name: verify local try-c9s workflow
        run: make try-c9s VERSION=local TRY_C9S_TIMEOUT=600s

      - name: clean local try-c9s workflow
        if: ${{ always() }}
        run: make try-c9s-clean || true
