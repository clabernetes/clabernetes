# Topology with no client-facing expose services created
# Use this when you don't need external access to nodes
# and want to minimize resource usage
apiVersion: c9s.run/v1alpha1
kind: Topology
metadata:
  name: no-services
spec:
  expose:
    # Disables expose services; internal fabric and alias services remain
    exposeType: None
  definition:
    containerlab: |
      name: no-services
      topology:
        nodes:
          srl1:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
          srl2:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
        links:
          - endpoints: ["srl1:e1-1", "srl2:e1-1"]
