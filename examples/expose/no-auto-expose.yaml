# Topology with auto-expose disabled
# With disableAutoExpose, the default management port list is not added, so a node is reachable
# on exactly the ports it declares -- and a node declaring none is not exposed at all.
# Ports are destination ports (the port the node listens on) with an optional protocol;
# clabernetes allocates the pod-side port carrying each one and records both in the Node status.
apiVersion: c9s.run/v1alpha1
kind: Topology
metadata:
  name: no-auto-expose
spec:
  expose:
    # Disable the automatic port list (SSH, gNMI, NETCONF, etc.)
    # Only ports defined in the containerlab topology will be exposed
    disableAutoExpose: true
  definition:
    containerlab: |
      name: manual-ports
      topology:
        nodes:
          srl1:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
            ports:
              - "22/tcp"
              - "57400/tcp"
          srl2:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
            ports:
              - "22/tcp"
        links:
          - endpoints: ["srl1:e1-1", "srl2:e1-1"]
