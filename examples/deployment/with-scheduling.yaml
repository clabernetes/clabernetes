# Topology with node scheduling constraints
# Control which Kubernetes nodes run the topology pods
apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: Topology
metadata:
  name: scheduled-topology
spec:
  deployment:
    scheduling:
      # Only schedule on nodes with these labels
      nodeSelector:
        kubernetes.io/arch: amd64
        node-type: network-lab
      # Tolerations for tainted nodes
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "network-lab"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      # Affinity / anti-affinity rules for launcher pods.
      # Use nodeAffinity to require or prefer specific nodes, and podAntiAffinity to spread
      # launcher pods across nodes (useful for large topologies).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - zone-a
                      - zone-b
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - network-lab
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    clabernetes/topology: scheduled-topology
                topologyKey: kubernetes.io/hostname
  definition:
    containerlab: |
      name: scheduled
      topology:
        nodes:
          srl1:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
          srl2:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
        links:
          - endpoints: ["srl1:e1-1", "srl2:e1-1"]
