# NVIDIA Cumulus VX with containerlab breakout ports, connected to a network multitool host.
# The kind-specific `port-count` and `breakouts` config generates /config/ports.conf, which the
# vrnetlab image uses to split port 1 into the four lanes swp1s0..swp1s3; the links use two of
# those lanes.
# Create a kubernetes.io/dockerconfigjson Secret named regcred in the
# same namespace before applying this Topology; the Cumulus image is restricted.
# NS=<namespace>
# kubectl create namespace $NS && \
# kubectl -n $NS create secret docker-registry regcred --docker-server=ghcr.io --docker-username="$(gh api user --jq .login)" --docker-password="$(gh auth token --hostname github.com)"
apiVersion: c9s.run/v1alpha1
kind: Topology
metadata:
  name: cumulus-multitool
spec:
  statusProbes:
    enabled: true
    nodeProbeConfigurations:
      cumulus:
        startupSeconds: 1200
        sshProbeConfiguration:
          username: cumulus
          password: Clab123!
          port: 22
      multitool:
        startupSeconds: 120
        sshProbeConfiguration:
          username: admin
          password: multit00l
          port: 22
  imagePull:
    pullSecrets:
      - regcred
  definition:
    containerlab: |
      name: cumulus-multitool
      topology:
        nodes:
          cumulus:
            kind: nvidia_cumulusvx
            image: ghcr.io/clab-labs/nvidia_cumulus:5.16.5-boxen
            port-count: 2
            breakouts:
              - port: 1
                channels: 4
            startup-config: |
              nv set interface swp1s0
              nv set interface swp1s0 ipv4 address 192.0.2.0/31
              nv set interface swp1s1
              nv set interface swp1s1 ipv4 address 192.0.2.2/31

          multitool:
            kind: linux
            image: ghcr.io/srl-labs/network-multitool:latest
            exec:
              - ip addr add 192.0.2.1/31 dev eth1
              - ip link set eth1 up
              - ip addr add 192.0.2.3/31 dev eth2
              - ip link set eth2 up

        links:
          - endpoints: ["cumulus:swp1s0", "multitool:eth1"]
          - endpoints: ["cumulus:swp1s1", "multitool:eth2"]
