# NVIDIA Cumulus VX connected to a network multitool host.
# Create a kubernetes.io/dockerconfigjson Secret named cumulus-registry in the
# same namespace before applying this Topology; the Cumulus image is restricted.
apiVersion: c9s.run/v1alpha1
kind: Topology
metadata:
  name: cumulus-multitool
spec:
  statusProbes:
    enabled: true
    nodeProbeConfigurations:
      cumulus:
        startupSeconds: 1200
        tcpProbeConfiguration:
          port: 22
      multitool:
        startupSeconds: 120
        sshProbeConfiguration:
          username: admin
          password: multit00l
          port: 22
  imagePull:
    pullSecrets:
      - cumulus-registry
  definition:
    containerlab: |
      name: cumulus-multitool
      topology:
        nodes:
          cumulus:
            kind: nvidia_cumulusvx
            image: ghcr.io/clab-labs/nvidia_cumulusvx:5.16.1

          multitool:
            kind: linux
            image: ghcr.io/srl-labs/network-multitool:latest

        links:
          - endpoints: ["cumulus:swp1", "multitool:eth1"]
