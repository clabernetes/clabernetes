# Topology demonstrating private registry configuration
# For actual private registry use:
# 1. Create pull secret:
#    kubectl create secret docker-registry my-registry-secret \
#      --docker-server=registry.example.com \
#      --docker-username=myuser \
#      --docker-password=mypass
# 2. Replace images with your private registry images
# 3. Uncomment pullSecrets configuration
---
apiVersion: c9s.run/v1alpha1
kind: Topology
metadata:
  name: private-registry
spec:
  imagePull:
    # Kubernetes pull policy for direct device containers unless the Node declares one.
    policy: IfNotPresent
    # Uncomment for private registry:
    # pullSecrets:
    #   - my-registry-secret
    # Registry mirrors, private CAs, and HTTP endpoints must also be configured in the kubelet's
    # container runtime. Controller-only metadata trust belongs in the singleton Config resource.
  definition:
    containerlab: |
      name: private
      topology:
        nodes:
          srl1:
            kind: nokia_srlinux
            # Replace with private registry image:
            # image: registry.example.com/nokia/srlinux:23.10.1
            image: ghcr.io/nokia/srlinux:latest
          srl2:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
        links:
          - endpoints: ["srl1:e1-1", "srl2:e1-1"]
