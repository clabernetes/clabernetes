---
{{ if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-clicker
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-clicker"
    c9s.run/component: clicker
{{ include "jobMetadata" . | indent 2 }}
spec:
  schedule: "{{ .Values.cron.schedule }}"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
{{ include "jobMetadata" . | indent 8 }}
        spec:
          containers:
{{ include "jobContainer" . | indent 10 }}
          restartPolicy: Never
          serviceAccountName: "{{ .Values.appName }}-clicker-service-account"
{{- end }}