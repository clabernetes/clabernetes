---
appName: &_appName clabernetes
globalTolerations: &globalTolerations
  - key: test_toleration
    operator: Equal
    value: "true"
    effect: PreferNoSchedule
globalConfig:
  deployment:
    resourcesByKind:
      custom-kind:
        requests:
          cpu: "2"
          memory: 3Gi
    resourcesByImage:
      '^registry\.example/custom:.*$':
        requests:
          cpu: "4"
          memory: 8Gi
  imagePull:
    policy: Always
    pullSecrets:
      - device-registry
    registryMetadataTrust:
      - registry: registry.lab.example:5000
        plainHTTP: true
    registryMetadataMirrors:
      - registry: docker.io
        endpoint: https://harbor.lab.example/v2/docker
        overridePath: true
manager:
  deploymentTolerations:
    - key: test_toleration_manager_only
      operator: Equal
      value: "true"
      effect: PreferNoSchedule
  resources:
    limits:
      memory: 256Mi
      cpu: 100m
