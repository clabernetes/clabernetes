---
appName: &_appName clabernetes
globalTolerations: &globalTolerations
  - key: test_toleration
    operator: Equal
    value: "true"
    effect: PreferNoSchedule
globalConfig:
  imagePull:
    policy: Always
    pullSecrets:
      - device-registry
    registryMetadataTrust:
      - registry: registry.lab.example:5000
        plainHTTP: true
manager:
  deploymentTolerations:
    - key: test_toleration_manager_only
      operator: Equal
      value: "true"
      effect: PreferNoSchedule
  resources:
    limits:
      memory: 256Mi
      cpu: 100m
