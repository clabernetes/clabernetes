---
# Source: clabernetes/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: clabernetes-config
  namespace: clabernetes
  labels:
    chart: "clabernetes-0.0.0"
    release: release-name
    heritage: Helm
    revision: "1"
    c9s.run/app: clabernetes
    c9s.run/name: "clabernetes-config"
    c9s.run/component: config
data:
  mergeMode: merge
  globalAnnotations: |-
    ---
    {}
  globalLabels: |-
    ---
    {}
  resourcesDefault: |-
    ---
    requests:
      cpu: 200m
      memory: 512Mi
  nodeSelectorsByImage: |-
    {}
    ---
  containerStopSignals: "false"
  imagePullPolicy: Always
  imagePullSecrets: |-
    - device-registry
  registryMetadataTrust: |-
    - plainHTTP: true
      registry: registry.lab.example:5000
  registryMetadataMirrors: |-
    - endpoint: https://harbor.lab.example/v2/docker
      overridePath: true
      registry: docker.io
