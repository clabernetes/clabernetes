---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nodes.c9s.run
spec:
  group: c9s.run
  names:
    kind: Node
    listKind: NodeList
    plural: nodes
    shortNames:
    - c9snode
    singular: node
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.readiness
      name: Readiness
      type: string
    - jsonPath: .status.conditions[?(@.type=='ContainersReady')].status
      name: Containers
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Prepared')].status
      name: Prepared
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='ConnectivityReady')].status
      name: Connectivity
      priority: 1
      type: string
    - jsonPath: .status.planDigest
      name: Plan
      priority: 1
      type: string
    - jsonPath: .status.appliedLauncherProfile.name
      name: Profile
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Node represents one logical containerlab node realized in a direct Kubernetes workload. Nodes
          are a primary clabernetes API -- they can be created by users directly, emitted by
          the (optional) Topology compiler, or created by any other machinery (i.e. a containerlab
          runtime); the Node controller treats all of these identically. The object name is the
          containerlab Node name and the namespace is the topology boundary. The spec is the flattened
          containerlab Node definition plus per-node payload and launcherProfileRef; wiring lives on Link
          objects and bounded allocations and observations live in status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeSpec is the spec for a Node resource. It is a *flat containerlab node definition* --
              containerlab vocabulary, no wrapper -- plus clabernetes-side per-node payload fields and an
              optional LauncherProfile reference. The definition must be self-contained: expanding topology
              defaults/kinds into the node is the emitter's job (the Topology compiler and clabverter do
              this for you). Anything that is deployment *policy* rather than node payload -- expose
              behavior, image pull defaults, generic resources, scheduling, and probes -- lives on
              LauncherProfile objects explicitly referenced by Nodes. The containerlab vocabulary here is a
              curated subset (see NodeDefinition): fields the direct runtime cannot realize are absent, and
              unknown fields are rejected rather than silently ignored.
            properties:
              aliases:
                description: |-
                  Aliases lists additional network names for the node. Each alias is realized as an extra
                  same-namespace headless Service selecting the node's Pod, so lab members resolve the
                  alias exactly like the node's own name. Aliases do not inherit from defaults or kinds.
                items:
                  maxLength: 63
                  pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              binds:
                description: Binds is a list of bind (mount) compatible strings.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              cap-add:
                description: CapAdd is a list of linux capabilities to add to the
                  node's container.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              certificate:
                description: Certificate holds the TLS certificate configuration for
                  the node.
                properties:
                  issue:
                    description: |-
                      Issue indicates if the node should have a certificate issued -- when unset the node does
                      not use TLS.
                    type: boolean
                  key-size:
                    description: KeySize is the size of the certificate key in bits.
                    type: integer
                  sans:
                    description: SANs is the list of subject alternative names to
                      add to the node's certificate.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  validity-duration:
                    description: |-
                      ValidityDuration is how long the issued certificate is valid for, as a Go duration --
                      i.e. 8760h for a year.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    type: string
                type: object
              cmd:
                description: Cmd overrides the container command.
                type: string
              components:
                description: Components holds the hardware component (i.e. SR-OS card/mda)
                  configuration for the node.
                items:
                  description: Component holds a hardware component configuration
                    (i.e. an SR-OS card or mda).
                  properties:
                    env:
                      additionalProperties:
                        type: string
                      description: Env holds environment variables for the component.
                      type: object
                    mda:
                      description: MDA holds the mda configuration of the component.
                      items:
                        description: MDA holds a single mda configuration of a hardware
                          component.
                        properties:
                          slot:
                            description: Slot is the slot of the mda.
                            type: integer
                          type:
                            description: Type is the type of the mda.
                            type: string
                        type: object
                      type: array
                    sfm:
                      description: SFM is the SFM (switch fabric module) of the component.
                      type: string
                    slot:
                      description: Slot is the slot identifier of the component.
                      type: string
                    type:
                      description: Type is the type of the component.
                      type: string
                    xiom:
                      description: XIOM holds the xiom configuration of the component.
                      items:
                        description: XIOM holds a single xiom configuration of a hardware
                          component.
                        properties:
                          mda:
                            description: MDA holds the mda configuration of the xiom.
                            items:
                              description: MDA holds a single mda configuration of
                                a hardware component.
                              properties:
                                slot:
                                  description: Slot is the slot of the mda.
                                  type: integer
                                type:
                                  description: Type is the type of the mda.
                                  type: string
                              type: object
                            type: array
                          slot:
                            description: Slot is the slot of the xiom.
                            type: integer
                          type:
                            description: Type is the type of the xiom.
                            type: string
                        type: object
                      type: array
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              config:
                description: Config holds containerlab config engine settings for
                  the node.
                properties:
                  vars:
                    additionalProperties:
                      x-kubernetes-preserve-unknown-fields: true
                    description: Vars holds the variables for the config engine.
                    type: object
                type: object
              cpu:
                description: |-
                  CPU is the number of vcpus to allocate for the node's container -- it becomes the
                  container's Kubernetes CPU limit.
                minimum: 0
                type: number
              devices:
                description: Devices is a list of host devices to map into the node's
                  container.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              dns:
                description: DNS holds the DNS configuration for the node.
                properties:
                  options:
                    description: Options is a list of DNS options.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  search:
                    description: Search is a list of DNS search domains.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  servers:
                    description: Servers is a list of DNS servers.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              enforce-startup-config:
                description: |-
                  EnforceStartupConfig makes the node boot from StartupConfig even when it already has a
                  saved (persisted) configuration.
                type: boolean
              entrypoint:
                description: Entrypoint overrides the container entrypoint.
                type: string
              env:
                additionalProperties:
                  type: string
                description: Env holds the environment variables for the node's container.
                type: object
              env-files:
                description: EnvFiles is a list of external files containing environment
                  variables for the node.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              exec:
                description: Exec is a list of commands to run in the node's container
                  once it is started.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              extras:
                description: Extras holds extra, possibly kind specific, node parameters.
                properties:
                  ceos-copy-to-flash:
                    description: CeosCopyToFlash is a list of paths to files which
                      are to be copied to the ceos flash dir.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  srl-agents:
                    description: SRLAgents is a list of Nokia SR Linux agents (spec
                      files) to install on the node.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              filesFromConfigMap:
                description: FilesFromConfigMap holds files staged from ConfigMaps
                  for this Node's application containers.
                items:
                  description: |-
                    FileFromConfigMap represents a file that you would like to mount (from a configmap) in the
                    device pod for a given node.
                  properties:
                    configMapName:
                      description: ConfigMapName is the name of the configmap to mount.
                      type: string
                    configMapPath:
                      description: |-
                        ConfigMapPath is the path/key in the configmap to mount, if not specified the configmap will
                        be mounted without a sub-path.
                      type: string
                    filePath:
                      description: FilePath is the path to mount the file.
                      type: string
                    mode:
                      default: read
                      description: |-
                        Mode sets the file permissions when mounting the configmap. Since the configmap will be read
                        only filesystem anyway, we basically just want to expose if the file should be mounted as
                        executable or not. So, default permissions would be 0o444 (read) and execute would be 0o555.
                      enum:
                      - read
                      - execute
                      type: string
                  required:
                  - configMapName
                  - filePath
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              filesFromSecret:
                description: |-
                  FilesFromSecret holds sensitive files projected from same-namespace Secrets into this Node's
                  direct application container.
                items:
                  description: FileFromSecret represents one file projected from a
                    same-namespace Kubernetes Secret.
                  properties:
                    filePath:
                      description: |-
                        FilePath is the absolute destination path, or the destination directory when SecretPath is
                        omitted and every Secret key is projected.
                      type: string
                    mode:
                      default: read
                      description: Mode selects read-only or read-and-execute permissions
                        for the staged file.
                      enum:
                      - read
                      - execute
                      type: string
                    secretName:
                      description: SecretName is the name of the same-namespace Secret.
                      type: string
                    secretPath:
                      description: |-
                        SecretPath is the Secret data key to project. When omitted, every key is projected beneath
                        FilePath in deterministic key order.
                      type: string
                  required:
                  - filePath
                  - secretName
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              filesFromURL:
                description: FilesFromURL holds files preparation must fetch and verify
                  before the Node starts.
                items:
                  description: |-
                    FileFromURL represents a file that you would like to mount from a URL in the device pod for
                    a given node.
                  properties:
                    digest:
                      description: |-
                        Digest is the required SHA-256 identity of the downloaded bytes in direct-runtime mode. It
                        prevents a mutable URL from changing a device payload without changing the accepted plan.
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    filePath:
                      description: FilePath is the path to mount the file.
                      type: string
                    url:
                      description: |-
                        URL is the url to fetch and mount at the provided FilePath. This URL must be a url that can
                        be simply downloaded and dumped to disk -- meaning a normal file server type endpoint or if
                        using GitHub or similar a "raw" path.
                      type: string
                  required:
                  - filePath
                  - url
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              group:
                description: |-
                  Group names the containerlab group a node belongs to. Group-scoped configuration from
                  the topology's groups section participates in the imported inheritance rules, and the
                  name itself is carried onto the compiled Node as a label.
                type: string
              healthcheck:
                description: |-
                  Healthcheck is the containerlab process health contract for the node; it merges over the
                  image-defined OCI healthcheck and is realized as container startup/readiness behavior.
                properties:
                  interval:
                    description: Interval is the time in seconds to wait between checks.
                    minimum: 0
                    type: integer
                  retries:
                    description: Retries is the number of consecutive failures needed
                      to consider the container unhealthy.
                    minimum: 0
                    type: integer
                  start-period:
                    description: |-
                      StartPeriod is the time in seconds to wait for the container to initialize before the
                      retries countdown starts.
                    minimum: 0
                    type: integer
                  test:
                    description: |-
                      Test is the command to run to check the health of the container -- the first element
                      selects the containerlab test form (i.e. CMD) and the remainder is the command itself.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  timeout:
                    description: Timeout is the time in seconds to wait before considering
                      a check to have hung.
                    minimum: 0
                    type: integer
                type: object
              image:
                description: Image is the container image for the node.
                type: string
              image-pull-policy:
                description: |-
                  ImagePullPolicy is the containerlab pull policy for the node's image; it maps onto the
                  equivalent Kubernetes image pull policy and takes precedence over profile and global
                  defaults.
                enum:
                - always
                - Always
                - never
                - Never
                - ifnotpresent
                - IfNotPresent
                type: string
              kind:
                description: Kind is the containerlab kind of the node -- i.e. nokia_srlinux.
                type: string
              launcherProfileRef:
                description: |-
                  LauncherProfileRef optionally names the same-namespace LauncherProfile supplying direct
                  workload policy. When omitted, global Config defaults are used.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              license:
                description: License is the path to the license file for the node.
                type: string
              link-apply-mode:
                description: |-
                  LinkApplyMode declares the lifecycle action used when the node's links change: live (no
                  lifecycle action), restart, or recreate. It overrides the kind's imported default.
                enum:
                - live
                - restart
                - recreate
                type: string
              memory:
                description: |-
                  Memory is the memory limit for the node's container in containerlab's human-readable
                  form -- i.e. 1Gb -- and becomes the container's Kubernetes memory limit.
                type: string
              mgmt-ipv4:
                description: MgmtIPv4 is the user-defined IPv4 address of the node
                  in the management network.
                type: string
              mgmt-ipv6:
                description: MgmtIPv6 is the user-defined IPv6 address of the node
                  in the management network.
                type: string
              network-mode:
                description: |-
                  NetworkMode declares that this node shares the network namespace -- and therefore the
                  device pod -- of the named primary node. `container:<primary node name>` is the only
                  accepted value: clabernetes derives node "grouping" (nodes co-located in one device pod,
                  i.e. the cards of a distributed chassis) from exactly this containerlab-native field, and
                  the other containerlab network modes have no meaning inside a device pod.
                maxLength: 73
                type: string
                x-kubernetes-validations:
                - message: network-mode must be container:<primary node name> -- it
                    declares that this node shares its device pod with the named primary
                    node
                  rule: self.matches('^container:[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
              ports:
                description: |-
                  Ports lists additional ports to expose on this node. Each entry is a destination port
                  between 1 and 65535 with an optional protocol -- "8080" or "5201/udp" -- meaning the port
                  the node itself listens on. clabernetes allocates the pod side port that carries it and
                  records both in the Node status, so docker style "host:container" bindings are rejected
                  here. Unless auto expose is disabled, the default set of management ports is exposed in
                  addition to these.
                items:
                  pattern: ^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(/(tcp|udp|TCP|UDP))?$
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              privileged:
                description: Privileged runs the node's container in privileged mode.
                type: boolean
              restart-policy:
                description: |-
                  RestartPolicy is the container restart policy for the node. Only the values with a
                  shared-Pod mapping are accepted -- a device container in a direct Pod always restarts
                  with its Pod, so Docker's "no" and "on-failure" policies cannot be represented.
                enum:
                - always
                - Always
                - unless-stopped
                - Unless-stopped
                type: string
              security-opts:
                description: |-
                  SecurityOpts is a list of security options (i.e. seccomp or apparmor settings) to apply to
                  the node's container.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              shm-size:
                description: ShmSize is the shared memory size allocated to the node's
                  container -- i.e. 256m.
                type: string
              startup-config:
                description: |-
                  StartupConfig is the startup configuration for the node -- either a path or an inline
                  (multiline string) config.
                type: string
              startup-delay:
                description: |-
                  StartupDelay is an optional delay in seconds applied before the node's application
                  container starts.
                type: integer
              suppress-startup-config:
                description: |-
                  SuppressStartupConfig boots the node with its factory configuration -- containerlab
                  generates and mounts no startup config at all.
                type: boolean
              sysctls:
                additionalProperties:
                  type: string
                description: Sysctls holds sysctl settings for the node.
                type: object
              tmpfs:
                additionalProperties:
                  type: string
                description: Tmpfs holds tmpfs mounts for the node's container, keyed
                  by destination path.
                type: object
              type:
                description: Type is the type of the node -- i.e. ixrd2.
                type: string
              user:
                description: User is the linux user to use in the node's container.
                type: string
            type: object
          status:
            description: |-
              NodeStatus is the status for a Node resource. Everything in here is an *allocation* or an
              *observation* made by the controller -- user intent never lives in the status.
            properties:
              appliedLauncherProfile:
                description: |-
                  AppliedLauncherProfile identifies the LauncherProfile revision successfully applied to the
                  direct workload. It is nil when the Node uses only global Config defaults.
                properties:
                  generation:
                    description: Generation is the applied LauncherProfile generation.
                    format: int64
                    type: integer
                  name:
                    description: Name is the LauncherProfile name.
                    type: string
                  uid:
                    description: UID distinguishes replacement profiles that reuse
                      a name.
                    type: string
                required:
                - generation
                - name
                - uid
                type: object
              conditions:
                description: Conditions contains the current conditions for this Node.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              directContainers:
                description: |-
                  DirectContainers contains bounded Kubernetes observations for application containers that
                  represent this logical Node. It contains no user intent or full plan data.
                items:
                  description: NodeDirectContainerStatus is one plan-addressed application-container
                    observation.
                  properties:
                    componentID:
                      description: ComponentID is the imported component identity
                        when this is not the logical primary.
                      type: string
                    id:
                      description: ID is the stable runtime-neutral container identity
                        from the applied plan.
                      type: string
                    imageID:
                      description: ImageID is the kubelet-observed immutable image
                        identity when available.
                      type: string
                    name:
                      description: Name is the deterministic Kubernetes container
                        name used with kubectl's -c option.
                      type: string
                    ready:
                      description: Ready is the Kubernetes application-container readiness
                        observation.
                      type: boolean
                    restartCount:
                      description: RestartCount is the kubelet-observed restart count.
                      format: int32
                      type: integer
                    state:
                      description: State is one of unknown, waiting, running, or terminated.
                      type: string
                  required:
                  - id
                  - name
                  - ready
                  - restartCount
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              directManagement:
                description: |-
                  DirectManagement contains the bounded management allocation from the applied direct plan.
                  It contains no credentials or kind-specific configuration.
                properties:
                  interfaceName:
                    description: InterfaceName is the package-selected management
                      interface in the Pod namespace.
                    type: string
                  ipv4:
                    description: IPv4 is the allocated IPv4 address and prefix.
                    type: string
                  ipv4Gateway:
                    description: IPv4Gateway is the source-specific IPv4 gateway.
                    type: string
                  ipv6:
                    description: IPv6 is the allocated IPv6 address and prefix.
                    type: string
                  ipv6Gateway:
                    description: IPv6Gateway is the source-specific IPv6 gateway.
                    type: string
                required:
                - interfaceName
                type: object
              exposedPorts:
                description: |-
                  ExposedPorts holds expose-port allocations for this Node. The controller assigns and programs
                  the direct Pod Service from this field.
                properties:
                  loadBalancerAddress:
                    description: |-
                      LoadBalancerAddress is the address of the load balancer exposing the node's ports (if the
                      expose service is of the LoadBalancer flavor).
                    type: string
                  ports:
                    description: Ports holds the individual port allocations for the
                      node.
                    items:
                      description: NodeExposedPort holds a single expose port allocation
                        for a Node.
                      properties:
                        destinationPort:
                          description: |-
                            DestinationPort is the port on the (containerlab) node itself -- this is the port the
                            expose service listens on.
                          type: integer
                        exposePort:
                          description: ExposePort is the allocated Service port targeting
                            the direct device Pod.
                          type: integer
                        protocol:
                          description: Protocol is the protocol of the port -- TCP
                            or UDP.
                          enum:
                          - TCP
                          - UDP
                          type: string
                      required:
                      - destinationPort
                      - exposePort
                      - protocol
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              planDigest:
                description: PlanDigest identifies the immutable direct device plan
                  observed by this status.
                type: string
              probeStatuses:
                description: |-
                  ProbeStatuses holds legacy nested-runtime probe observations during migration. Direct mode
                  reports application and helper observations through Conditions and DirectContainers.
                properties:
                  livenessProbe:
                    description: LivenessProbe is the status of the node's liveness
                      probe.
                    enum:
                    - passing
                    - failing
                    - unknown
                    - disabled
                    type: string
                  readinessProbe:
                    description: ReadinessProbe is the status of the node's readiness
                      probe.
                    enum:
                    - passing
                    - failing
                    - unknown
                    - disabled
                    type: string
                  startupProbe:
                    description: StartupProbe is the status of the node's startup
                      probe.
                    enum:
                    - passing
                    - failing
                    - unknown
                    - disabled
                    type: string
                required:
                - livenessProbe
                - readinessProbe
                - startupProbe
                type: object
              readiness:
                description: |-
                  Readiness is the controller-observed readiness of this Node's active runtime -- one of
                  "ready", "notready" or "unknown".
                enum:
