---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: links.c9s.run
spec:
  group: c9s.run
  names:
    kind: Link
    listKind: LinkList
    plural: links
    shortNames:
    - c9slink
    singular: link
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.endpointA.nodeName
      name: Node-A
      type: string
    - jsonPath: .spec.endpointA.interfaceName
      name: Interface-A
      type: string
    - jsonPath: .spec.endpointB.nodeName
      name: Node-B
      type: string
    - jsonPath: .spec.endpointB.interfaceName
      name: Interface-B
      type: string
    - jsonPath: .spec.connectivity
      name: Connectivity
      type: string
    - jsonPath: .status.tunnelID
      name: Tunnel-ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .status.error
      name: Error
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Link represents a single point-to-point "wire" between two (containerlab) nodes. Links are a
          primary clabernetes API -- like Nodes they can be created by users directly or emitted by the
          (optional) Topology compiler. The spec holds only the wire as the user drew it: two endpoints
          (Node object names in the same namespace plus interface names), connectivity flavor, and an
          optional MTU. The Link controller allocates a tunnel ID into status for cross-Pod transports;
          same-Pod, loopback, and host Links need no tunnel allocation. Direct connectivity reconcilers
          select only Links terminating on their Nodes with endpoint field selectors. Storing one object
          per wire keeps every persisted object O(1) regardless of topology size.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LinkSpec is the spec for a Link resource -- the wire as the user drew it, nothing else.
              Anything operational (the allocated tunnel ID and resolved identities) lives in status, and
              current peer transport identity is derived by direct connectivity reconcilers.
            properties:
              connectivity:
                default: vxlan
                description: |-
                  Connectivity is the flavor used to realize this Link across direct Pods. Empty values on
                  objects stored before API defaulting was introduced are normalized to VXLAN by consumers.
                enum:
                - vxlan
                - slurpeeth
                type: string
              endpointA:
                description: EndpointA is the "a" side of this link.
                properties:
                  interfaceName:
                    description: InterfaceName is the name of the interface on the
                      node this side of the link is on.
                    minLength: 1
                    type: string
                  nodeName:
                    description: |-
                      NodeName is the name of the Node object (and therefore containerlab node) this side of the
                      link resides on -- or the reserved name `host` for a (node local) host link.
                    minLength: 1
                    type: string
                required:
                - interfaceName
                - nodeName
                type: object
              endpointB:
                description: EndpointB is the "b" side of this link.
                properties:
                  interfaceName:
                    description: InterfaceName is the name of the interface on the
                      node this side of the link is on.
                    minLength: 1
                    type: string
                  nodeName:
                    description: |-
                      NodeName is the name of the Node object (and therefore containerlab node) this side of the
                      link resides on -- or the reserved name `host` for a (node local) host link.
                    minLength: 1
                    type: string
                required:
                - interfaceName
                - nodeName
                type: object
              mtu:
                description: MTU is the MTU for both direct endpoint interfaces; zero
                  means unset.
                type: integer
            required:
            - endpointA
            - endpointB
            type: object
          status:
            description: LinkStatus is the status for a Link resource.
            properties:
              conditions:
                description: |-
                  Conditions contains bounded controller observations for this Link. It does not claim
                  dataplane readiness, which remains observable through endpoint Node connectivity status.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              error:
                description: |-
                  Error is a compact compatibility field containing the current Accepted=False message. New
                  consumers should prefer Conditions.
                type: string
              resolvedEndpoints:
                description: |-
                  ResolvedEndpoints identifies the exact Nodes to which this Link is bound. The controller
                  sets both endpoints atomically after every non-host endpoint resolves. A host endpoint is
                  recorded by name with an empty UID because it does not refer to a Node object.
                properties:
                  endpointA:
                    description: EndpointA is the resolved identity corresponding
                      to spec.endpointA.
                    properties:
                      nodeName:
                        description: NodeName is the observed endpoint Node name,
                          or the reserved name "host".
                        type: string
                      uid:
                        description: UID distinguishes replacement Nodes that reuse
                          a name. It is empty only for host endpoints.
                        type: string
                    required:
                    - nodeName
                    type: object
                  endpointB:
                    description: EndpointB is the resolved identity corresponding
                      to spec.endpointB.
                    properties:
                      nodeName:
                        description: NodeName is the observed endpoint Node name,
                          or the reserved name "host".
                        type: string
                      uid:
                        description: UID distinguishes replacement Nodes that reuse
                          a name. It is empty only for host endpoints.
                        type: string
                    required:
                    - nodeName
                    type: object
                required:
                - endpointA
                - endpointB
                type: object
              tunnelID:
                description: |-
                  TunnelID is the id number of the tunnel (vxlan vnid or slurpeeth segment id) the controller
                  allocated for this link -- both sides of the link use the same id. This is an allocation
                  rather than user intent, hence it living in the status; zero means "not allocated (yet)"
                  (direct connectivity reconcilers wait until the controller has filled the ID in).
                maximum: 16000000
                minimum: 0
                type: integer
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.endpointA.nodeName
    - jsonPath: .spec.endpointB.nodeName
    served: true
    storage: true
    subresources:
      status: {}
