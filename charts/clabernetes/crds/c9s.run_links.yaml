---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: links.c9s.run
spec:
  group: c9s.run
  names:
    kind: Link
    listKind: LinkList
    plural: links
    shortNames:
    - c9slink
    singular: link
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.endpointA.nodeName
      name: Node-A
      type: string
    - jsonPath: .spec.endpointA.interfaceName
      name: Interface-A
      type: string
    - jsonPath: .spec.endpointB.nodeName
      name: Node-B
      type: string
    - jsonPath: .spec.endpointB.interfaceName
      name: Interface-B
      type: string
    - jsonPath: .status.wireID
      name: Wire-ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Link represents a single point-to-point "wire" between two (containerlab) nodes. Links are a
          primary clabernetes API -- like Nodes they can be created by users directly or emitted by the
          (optional) Topology compiler. The spec holds only the wire as the user drew it: two endpoints
          (Node object names in the same namespace plus interface names) and an optional MTU. The Link
          controller allocates a wire ID into status for cross-Pod transports; same-Pod, loopback, and
          host Links need no wire allocation. Direct connectivity reconcilers select only Links
          terminating on their Nodes with endpoint field selectors. Storing one object per wire keeps
          every persisted object O(1) regardless of topology size.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LinkSpec is the spec for a Link resource -- the wire as the user drew it, nothing else.
              Anything operational (the allocated wire ID and resolved identities) lives in status, and
              current peer transport identity is derived by direct connectivity reconcilers.
            properties:
              endpointA:
                description: EndpointA is the "a" side of this link.
                properties:
                  interfaceName:
                    description: InterfaceName is the name of the interface on the
                      node this side of the link is on.
                    minLength: 1
                    type: string
                  ipv4:
                    description: |-
                      IPv4 is the optional IPv4 CIDR prefix containerlab assigns to this endpoint. It is cold-plan
                      configuration for kinds that consume endpoint addresses; changing it on a realized Node
                      requires recreation. It is invalid on the reserved host endpoint.
                    type: string
                  ipv6:
                    description: |-
                      IPv6 is the optional IPv6 CIDR prefix containerlab assigns to this endpoint. It is cold-plan
                      configuration for kinds that consume endpoint addresses; changing it on a realized Node
                      requires recreation. It is invalid on the reserved host endpoint.
                    type: string
                  netem:
                    description: |-
                      Netem is the link impairment of the packets this side of the link sends -- the same
                      impairment containerlab's endpoint `netem` key declares. On a cross-Pod Link the peer
                      Pod's connectivity sidecar programs it as the root qdisc of its sidecar leg, which these
                      packets cross on their way to the peer, so it applies whatever the device does with its own
                      interface. On a Link within one Pod, and on a host Link, the connectivity sidecar owning
                      this endpoint programs it as the endpoint interface's root qdisc. The sidecar re-asserts it
                      while the Pod runs, so it survives the interface being recreated. Changing it is always
                      applied live.
                    properties:
                      corruption:
                        description: Corruption is the random packet corruption in
                          percent -- i.e. 0.1 for 0.1%.
                        maximum: 100
                        minimum: 0
                        type: number
                      delay:
                        description: |-
                          Delay is the time packets are delayed by, as a Go duration -- i.e. 50ms. The connectivity
                          sidecar programs the qdisc in 32-bit kernel ticks, which caps the delay at 4m.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: delay must be at most 4m
                          rule: duration(self) <= duration('4m')
                      jitter:
                        description: |-
                          Jitter is the delay variation, as a Go duration -- i.e. 5ms. It needs a positive
                          delay, and the kernel caps it at 2.147483647s, so a longer jitter is rejected rather than
                          silently capped.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: jitter must be at most 2.147483647s
                          rule: duration(self) <= duration('2147483647ns')
                      loss:
                        description: Loss is the random packet loss in percent --
                          i.e. 0.5 for 0.5%.
                        maximum: 100
                        minimum: 0
                        type: number
                      rate:
                        description: |-
                          Rate is the rate limit in kbit/s. The maximum is the highest rate containerlab accepts,
                          the highest one whose rate in bytes/s fits 64 bits; it is a rule rather than a schema
                          maximum because the schema stores maximums as floats, which can't hold it exactly.
                        format: int64
                        minimum: 0
                        type: integer
                        x-kubernetes-validations:
                        - message: rate must be at most 18446744073709551 kbit/s
                          rule: self <= 18446744073709551
                    type: object
                    x-kubernetes-validations:
                    - message: jitter cannot be set without setting delay
                      rule: '!has(self.jitter) || (has(self.delay) && duration(self.delay)
                        > duration(''0s''))'
                  nodeName:
                    description: |-
                      NodeName is the name of the Node object (and therefore containerlab node) this side of the
                      link resides on -- or the reserved name `host` for a (node local) host link.
                    minLength: 1
                    type: string
                required:
                - interfaceName
                - nodeName
                type: object
                x-kubernetes-validations:
                - message: a host endpoint cannot have a netem impairment -- impair
                    the Node endpoint instead
                  rule: self.nodeName != 'host' || !has(self.netem)
              endpointB:
                description: EndpointB is the "b" side of this link.
                properties:
                  interfaceName:
                    description: InterfaceName is the name of the interface on the
                      node this side of the link is on.
                    minLength: 1
                    type: string
                  ipv4:
                    description: |-
                      IPv4 is the optional IPv4 CIDR prefix containerlab assigns to this endpoint. It is cold-plan
                      configuration for kinds that consume endpoint addresses; changing it on a realized Node
                      requires recreation. It is invalid on the reserved host endpoint.
                    type: string
                  ipv6:
                    description: |-
                      IPv6 is the optional IPv6 CIDR prefix containerlab assigns to this endpoint. It is cold-plan
                      configuration for kinds that consume endpoint addresses; changing it on a realized Node
                      requires recreation. It is invalid on the reserved host endpoint.
                    type: string
                  netem:
                    description: |-
                      Netem is the link impairment of the packets this side of the link sends -- the same
                      impairment containerlab's endpoint `netem` key declares. On a cross-Pod Link the peer
                      Pod's connectivity sidecar programs it as the root qdisc of its sidecar leg, which these
                      packets cross on their way to the peer, so it applies whatever the device does with its own
                      interface. On a Link within one Pod, and on a host Link, the connectivity sidecar owning
                      this endpoint programs it as the endpoint interface's root qdisc. The sidecar re-asserts it
                      while the Pod runs, so it survives the interface being recreated. Changing it is always
                      applied live.
                    properties:
                      corruption:
                        description: Corruption is the random packet corruption in
                          percent -- i.e. 0.1 for 0.1%.
                        maximum: 100
                        minimum: 0
                        type: number
                      delay:
                        description: |-
                          Delay is the time packets are delayed by, as a Go duration -- i.e. 50ms. The connectivity
                          sidecar programs the qdisc in 32-bit kernel ticks, which caps the delay at 4m.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: delay must be at most 4m
                          rule: duration(self) <= duration('4m')
                      jitter:
                        description: |-
                          Jitter is the delay variation, as a Go duration -- i.e. 5ms. It needs a positive
                          delay, and the kernel caps it at 2.147483647s, so a longer jitter is rejected rather than
                          silently capped.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: jitter must be at most 2.147483647s
                          rule: duration(self) <= duration('2147483647ns')
                      loss:
                        description: Loss is the random packet loss in percent --
                          i.e. 0.5 for 0.5%.
                        maximum: 100
                        minimum: 0
                        type: number
                      rate:
                        description: |-
                          Rate is the rate limit in kbit/s. The maximum is the highest rate containerlab accepts,
                          the highest one whose rate in bytes/s fits 64 bits; it is a rule rather than a schema
                          maximum because the schema stores maximums as floats, which can't hold it exactly.
                        format: int64
                        minimum: 0
                        type: integer
                        x-kubernetes-validations:
                        - message: rate must be at most 18446744073709551 kbit/s
                          rule: self <= 18446744073709551
                    type: object
                    x-kubernetes-validations:
                    - message: jitter cannot be set without setting delay
                      rule: '!has(self.jitter) || (has(self.delay) && duration(self.delay)
                        > duration(''0s''))'
                  nodeName:
                    description: |-
                      NodeName is the name of the Node object (and therefore containerlab node) this side of the
                      link resides on -- or the reserved name `host` for a (node local) host link.
                    minLength: 1
                    type: string
                required:
                - interfaceName
                - nodeName
                type: object
                x-kubernetes-validations:
                - message: a host endpoint cannot have a netem impairment -- impair
                    the Node endpoint instead
                  rule: self.nodeName != 'host' || !has(self.netem)
              mtu:
                description: MTU is the MTU for both direct endpoint interfaces; zero
                  means unset.
                type: integer
            required:
            - endpointA
            - endpointB
            type: object
          status:
            description: LinkStatus is the status for a Link resource.
            properties:
              conditions:
                description: |-
                  Conditions contains bounded controller observations for this Link. It does not claim
                  dataplane readiness, which remains observable through endpoint Node connectivity status.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              resolvedEndpoints:
                description: |-
                  ResolvedEndpoints identifies the exact Nodes to which this Link is bound. The controller
                  sets both endpoints atomically after every non-host endpoint resolves. A host endpoint is
                  recorded by name with an empty UID because it does not refer to a Node object.
                properties:
                  endpointA:
                    description: EndpointA is the resolved identity corresponding
                      to spec.endpointA.
                    properties:
                      nodeName:
                        description: NodeName is the observed endpoint Node name,
                          or the reserved name "host".
                        type: string
                      uid:
                        description: UID distinguishes replacement Nodes that reuse
                          a name. It is empty only for host endpoints.
                        type: string
                    required:
                    - nodeName
                    type: object
                  endpointB:
                    description: EndpointB is the resolved identity corresponding
                      to spec.endpointB.
                    properties:
                      nodeName:
                        description: NodeName is the observed endpoint Node name,
                          or the reserved name "host".
                        type: string
                      uid:
                        description: UID distinguishes replacement Nodes that reuse
                          a name. It is empty only for host endpoints.
                        type: string
                    required:
                    - nodeName
                    type: object
                required:
                - endpointA
                - endpointB
                type: object
              wireID:
                description: |-
                  WireID is the identity this link carries on the fabric wire between its two endpoint
                  sidecars -- both sides of the link use the same id, and it is unique among the Links of
                  this namespace (wire datagrams dispatch inside one receiving sidecar from a validated
                  source, so cross-namespace uniqueness is meaningless). This is an allocation rather than
                  user intent, hence it living in the status; zero means "not allocated (yet)" (direct
                  connectivity reconcilers wait until the controller has filled the ID in).
                maximum: 16000000
                minimum: 0
                type: integer
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.endpointA.nodeName
    - jsonPath: .spec.endpointB.nodeName
    served: true
    storage: true
    subresources:
      status: {}
