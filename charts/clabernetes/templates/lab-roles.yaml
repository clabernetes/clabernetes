{{- define "clabernetes.labViewerRules" }}
  - apiGroups:
      - c9s.run
    resources:
      - topologies
      - nodes
      - links
      - nodeprofiles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - events
      - services
      - configmaps
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
{{- end }}
{{- if .Values.labRoles.enabled }}
{{- /*
  Client roles for people and services that work with labs. Bind them per lab namespace with a
  RoleBinding; they are deliberately not aggregated into the built-in view/edit roles, so binding
  edit somewhere never grants lab access implicitly. See docs/guides/lab-access.md.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-lab-viewer"
    c9s.run/component: lab-role
    {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 4 }}
    {{- end }}
  {{- if .Values.globalAnnotations }}
  annotations:
{{ .Values.globalAnnotations | toYaml | indent 4 }}
  {{- end }}
  name: "{{ .Values.appName }}-lab-viewer"
rules:
{{- include "clabernetes.labViewerRules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-lab-editor"
    c9s.run/component: lab-role
    {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 4 }}
    {{- end }}
  {{- if .Values.globalAnnotations }}
  annotations:
{{ .Values.globalAnnotations | toYaml | indent 4 }}
  {{- end }}
  name: "{{ .Values.appName }}-lab-editor"
rules:
{{- include "clabernetes.labViewerRules" . }}
  # Labs are edited only through c9s resources: stopping, starting, and restarting a node is a
  # patch on its Node. No apps/* and no Pod create/update/delete.
  - apiGroups:
      - c9s.run
    resources:
      - topologies
      - nodes
      - links
      - nodeprofiles
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - update
      - patch
      - delete
  # Persistent node state survives a plain destroy; deleting it (destroy --cleanup) is the
  # only write a lab needs on claims. The controllers create them.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - delete
  # Interactive streams. WebSocket clients open them with GET, which API servers before
  # Kubernetes 1.35 authorize as the get verb; create covers SPDY clients and 1.35+.
  - apiGroups:
      - ""
    resources:
      - pods/exec
      - pods/portforward
    verbs:
      - get
      - create
{{- end }}
