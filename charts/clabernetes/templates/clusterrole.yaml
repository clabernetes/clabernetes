---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-cluster-role"
    c9s.run/component: cluster-role
    {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 4 }}
    {{- end }}
  {{- if .Values.globalAnnotations }}
  annotations:
{{ .Values.globalAnnotations | toYaml | indent 4 }}
  {{- end }}
  name: "{{ .Values.appName }}-cluster-role"
rules:
  - apiGroups:
      - c9s.run
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - namespaces
      - secrets
      - configmaps
      - services
      - pods
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
    {{- if .Values.manager.restrictedRBAC.enabled }}
      - list
      - watch
    {{- else }}
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
    {{- end }}
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
    {{- if .Values.manager.restrictedRBAC.enabled }}
      - list
      - watch
    {{- else }}
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
    {{- end }}
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
    {{- if .Values.manager.restrictedRBAC.enabled }}
      - list
      - watch
    {{- else }}
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
    {{- end }}
  {{- if not .Values.manager.restrictedRBAC.enabled }}
  {{- /* restricted installs grant pods/log, pods/exec, and events per namespace via the
         namespaced Roles; a cluster-wide exec grant would defeat restricted RBAC. */}}
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  {{- end }}
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
    {{- if .Values.manager.restrictedRBAC.enabled }}
      - list
      - watch
    {{- else }}
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
    {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-launcher-role"
    c9s.run/component: launcher-role
    {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 4 }}
    {{- end }}
  {{- if .Values.globalAnnotations }}
  annotations:
{{ .Values.globalAnnotations | toYaml | indent 4 }}
  {{- end }}
  name: "{{ .Values.appName }}-launcher-role"
rules:
  - apiGroups:
      - c9s.run
    resources:
      - nodes
      - links
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-direct-runtime-role"
    c9s.run/component: direct-runtime-role
    {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 4 }}
    {{- end }}
  {{- if .Values.globalAnnotations }}
  annotations:
{{ .Values.globalAnnotations | toYaml | indent 4 }}
  {{- end }}
  name: "{{ .Values.appName }}-direct-runtime-role"
rules:
  - apiGroups:
      - c9s.run
    resources:
      - links
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
