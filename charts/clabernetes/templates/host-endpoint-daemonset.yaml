{{- if eq .Values.manager.deviceRuntimeMode "direct" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: "{{ .Values.appName }}-host-endpoint"
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    revision: "{{ .Release.Revision }}"
    app.kubernetes.io/name: "{{ .Values.appName }}-host-endpoint"
    c9s.run/app: {{ .Values.appName }}
    c9s.run/name: "{{ .Values.appName }}-host-endpoint"
    c9s.run/component: host-endpoint
    {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 4 }}
    {{- end }}
  {{- if .Values.globalAnnotations }}
  annotations:
{{ .Values.globalAnnotations | toYaml | indent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      c9s.run/app: {{ .Values.appName }}
      release: {{ .Release.Name }}
      c9s.run/component: host-endpoint
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        release: {{ .Release.Name }}
        heritage: {{ .Release.Service }}
        revision: "{{ .Release.Revision }}"
        app.kubernetes.io/name: "{{ .Values.appName }}-host-endpoint"
        c9s.run/app: {{ .Values.appName }}
        c9s.run/name: "{{ .Values.appName }}-host-endpoint"
        c9s.run/component: host-endpoint
        {{- if .Values.globalLabels }}
{{ .Values.globalLabels | toYaml | indent 8 }}
        {{- end }}
      {{- if .Values.globalAnnotations }}
      annotations:
{{ .Values.globalAnnotations | toYaml | indent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: "{{ .Values.appName }}-host-endpoint"
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      containers:
        - name: host-endpoint
          {{- if .Values.manager.image }}
          image: {{ .Values.manager.image }}
          {{- else if eq .Chart.Version "0.0.0" }}
          image: "ghcr.io/clabernetes/clabernetes/clabernetes-manager:dev-latest"
          {{- else }}
          image: "ghcr.io/clabernetes/clabernetes/clabernetes-manager:{{ .Chart.Version }}"
          {{- end }}
          imagePullPolicy: {{ .Values.manager.imagePullPolicy }}
          command:
            - /clabernetes/manager
            - device-runtime
            - host-endpoint-daemon
          args:
            - --nodeName=$(C9S_WORKER_NODE_NAME)
            - --socket=/var/run/clabernetes/host-endpoint/daemon.sock
          env:
            - name: C9S_WORKER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: host-endpoint-socket
              mountPath: /var/run/clabernetes/host-endpoint
      volumes:
        - name: host-endpoint-socket
          hostPath:
            path: /var/run/clabernetes/host-endpoint
            type: DirectoryOrCreate
{{- end }}
