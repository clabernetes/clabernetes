---
#
# global options
#
# note the yaml anchors, we use these to easily pass the same values to the clicker sub-chart (if
# enabling); there is no magic here other than yaml anchor magic, if you expect the "global" things
# to be really global and applied to the clicker (or any other future) dependency then use anchors
# or pass things explicitly. this felt better than using actual helm "globals"
#

appName: &_appName clabernetes

# extra labels/annotations that are added to all objects
globalAnnotations: &_globalAnnotations {}
globalLabels: &_globalLabels {}
globalTolerations: &globalTolerations []

#
# manager options
#
# the manager is the c9s controller
#
manager:
  deploymentAnnotations: {}
  deploymentLabels: {}
  deploymentTolerations: []
  podAnnotations: {}
  podLabels: {}

  # defaults to .Chart.Version, if 0.0.0 version defaults to 'dev-latest' tag
  image: "" # ghcr.io/clabernetes/clabernetes/clabernetes-manager:{{ .Chart.Version }}
  imagePullPolicy: IfNotPresent

  replicaCount: 3
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits: {}

  clientOperationTimeoutMultiplier: 1
  managerLogLevel: info
  controllerLogLevel: info
  # Loopback-only metrics (9090) and pprof (6060), accessed with kubectl port-forward.
  # Enables sampled block/mutex profiling; leave disabled outside investigations.
  diagnostics: false

  # pod affinity settings, directly inserted into manager deployment spec; if not provided basic
  # common-sense anti-affinity is applied.
  affinity: {}
  # restrictedRBAC enables a more restricted RBAC setup for the manager. When enabled, the
  # ClusterRole given to the manager's ServiceAccount is more limited, and a Role and
  # RoleBinding are created in each of the namespaces listed in `targetNamespaces` below to
  # grant extra permissions.
  # This is needed on OpenShift clusters to prevent default SCC restrictions.
  restrictedRBAC:
    enabled: false
    targetNamespaces: []

# Client roles for lab users: the clabernetes-lab-viewer and clabernetes-lab-editor ClusterRoles
# (named after appName). Bind them per lab namespace with a RoleBinding; they are not aggregated
# into the built-in view/edit roles. Lab users are trusted on the workers their labs run on, see
# the "Lab access" guide.
labRoles:
  enabled: true

# Reusable, network-isolated workers. Each request runs in a fresh process and private scratch.
# Disable to use the disposable per-node planner Pods during rollout or troubleshooting.
plannerPool:
  enabled: true
  replicas: 4
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 512Mi

#
# global config
#
# disable this if you are using argocd/flux -- in that case you should probably manage a single
# manifest file with the config singleton and your configs in it. otherwise, this will be deployed
# into a configmap, which will then be processed by init containers in the manager deployment. the
# init containers will take this data and merge the configs into the global config custom resource
# singleton. once complete, the configmap will be deleted (hence why you don't want this if you are
# using argocd/flux). the idea here is this makes helm deploys simple, while still giving us the
# ability to add fields to the CR (without versioning) without helm having a heart attack. we delete
# the configmap after merging because we don't want there to be any ambiguity about where to config
# global things (that should only be in the CR singleton). note that the `mergeMode` will define
# how this config data is merged into an existing config CR singleton.
#
globalConfig:
  enabled: true

  # can be "merge" or "overwrite" -- if "merge" any values from this bootstrap config data *not*
  # present in a potentially existing global config CR are copied over to the CR, while any data
  # that is already set in the CR is left alone. This is the default and "safe" option. You can
  # also set this to "overwrite" for a more declarative option where this bootstrap config data
  # replaces the existing CR entirely.
  #
  mergeMode: merge

  # Optional installation-wide startup limit for standalone Nodes and Topology output.
  # Set batchSize to a positive number to enable; explicit zero disables the limit.
  # maxConcurrentPerHost caps device boots per Kubernetes host; zero disables it.
  rollout: {}

  imagePull:
    # policy is the Kubernetes imagePullPolicy default for direct application containers whose
    # source Node definition does not explicitly declare one.
    policy: IfNotPresent
    # pullSecrets lists same-namespace Docker-config Secrets placed on direct device Pods. Every
    # listed Secret must exist in each workload namespace inheriting this global default.
    pullSecrets: []
    # registryMetadataTrust is a controller-only, exact-registry policy for reading OCI manifests
    # and configuration blobs. It does not configure kubelets. Configure the same CA or HTTP
    # endpoint independently in every eligible node runtime.
    # registryMetadataTrust:
    #   - registry: registry.example.test:5000
    #     caBundle: |-
    #       -----BEGIN CERTIFICATE-----
    #       ...
    #       -----END CERTIFICATE-----
    #   - registry: registry.lab.test:5001
    #     plainHTTP: true
    registryMetadataTrust: []
    # registryMetadataMirrors redirects controller-only OCI metadata requests for exact source
    # registries to a mirror endpoint, matching a CRI pull-through configuration (containerd
    # hosts.toml). It does not configure kubelets, and never rewrites image references or Pod
    # image strings. An endpoint path requires overridePath (Harbor proxy-project semantics);
    # trust for the mirror connection comes from the registryMetadataTrust entry matching the
    # endpoint host.
    # registryMetadataMirrors:
    #   - registry: docker.io
    #     endpoint: https://harbor.example.test/v2/docker
    #     overridePath: true
    #   - registry: ghcr.io
    #     endpoint: https://harbor.example.test/v2/ghcr
    #     overridePath: true
    registryMetadataMirrors: []

  deployment:
    # resourcesDefault hold the default resources to apply to each logical Node's primary direct
    # application container.
    # for reference fields should be formatted like "normal" k8s resources:
    # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#example-1
    resourcesDefault:
      requests:
        memory: 512Mi
        cpu: 200m

    # resourcesByKind maps exact, case-sensitive containerlab kinds (including independent aliases)
    # to primary-container resource defaults. A matching image rule or explicit NodeProfile wins.
    resourcesByKind:
      6wind_vsr: &native-medium
        requests: {cpu: "2", memory: 4Gi}
      ale_vaos: &vm-2-3
        requests: {cpu: "2", memory: 3Gi}
      arista_ceos: &ceos
        requests: {cpu: "1", memory: 2Gi}
      ceos: *ceos
      arista_veos: &vm-2-3-alias
        requests: {cpu: "2", memory: 3Gi}
      vr-veos: *vm-2-3-alias
      vr-arista_veos: *vm-2-3-alias
      arrcus_arcos: &vm-4-17
        requests: {cpu: "4", memory: 17Gi}
      aruba_aoscx: &vm-4-9
        requests: {cpu: "4", memory: 9Gi}
      vr-aoscx: *vm-4-9
      vr-aruba_aoscx: *vm-4-9
      c8000: &c8000
        requests: {cpu: "4", memory: 22Gi}
      cisco_c8000: *c8000
      checkpoint_cloudguard: &vm-1-5
        requests: {cpu: "1", memory: 5Gi}
      ciena_saos: &vm-2-9
        requests: {cpu: "2", memory: 9Gi}
      vr-ciena_saos: *vm-2-9
      cisco_asav: &vm-1-3
        requests: {cpu: "1", memory: 3Gi}
      cisco_c8000v: &vm-1-5-alias
        requests: {cpu: "1", memory: 5Gi}
      cisco_cat9kv: &vm-4-19
        requests: {cpu: "4", memory: 19Gi}
      cisco_csr1000v: &csr
        requests: {cpu: "1", memory: 5Gi}
      vr-csr: *csr
      vr-cisco_csr1000v: *csr
      cisco_ftdv: *vm-4-9
      cisco_iol: &iol
        requests: {cpu: "1", memory: 1Gi}
      cisco_n9kv: &vm-4-11
        requests: {cpu: "4", memory: 11Gi}
      vr-n9kv: *vm-4-11
      vr-cisco_n9kv: *vm-4-11
      cisco_sdwan: &vm-1-17
        requests: {cpu: "1", memory: 17Gi}
      cisco_vios: *iol
      cisco_xrd: &xrd
        requests: {cpu: "2", memory: 4Gi}
      xrd: *xrd
      cisco_xrd_vrouter: *vm-4-11
      cisco_xrv: &xrv
        requests: {cpu: "1", memory: 5Gi}
      vr-xrv: *xrv
      vr-cisco_xrv: *xrv
      cisco_xrv9k: &vm-2-17
        requests: {cpu: "2", memory: 17Gi}
      vr-xrv9k: *vm-2-17
      vr-cisco_xrv9k: *vm-2-17
      cjunosevolved: &cjunos
        requests: {cpu: "4", memory: 10Gi}
      juniper_cjunosevolved: *cjunos
      crpd: &crpd
        requests: {cpu: "1", memory: 2Gi}
      juniper_crpd: *crpd
      cvx: &cvx
        requests: {cpu: "1", memory: 1Gi}
      cumulus_cvx: *cvx
      dell_ftosv: &vm-4-5
        requests: {cpu: "4", memory: 5Gi}
      vr-ftosv: *vm-4-5
      vr-dell_ftosv: *vm-4-5
      dell_sonic: &vm-2-5
        requests: {cpu: "2", memory: 5Gi}
      f5_bigip-ve: *vm-4-9
      fdio_vpp: &light
        requests: {cpu: 250m, memory: 512Mi}
      fortinet_fortigate: &fortinet
        requests: {cpu: "2", memory: 3Gi}
      fortinet_fortiproxy: *fortinet
      freebsd: &vm-1-1
        requests: {cpu: "1", memory: 1Gi}
      openbsd: *vm-1-1
      frr: &frr
        requests: {cpu: 250m, memory: 512Mi}
      frrouting: *frr
      generic_vm: *vm-1-5
      huawei_vrp: &vm-2-3-huawei
        requests: {cpu: "2", memory: 3Gi}
      ipinfusion_ocnos: *vm-2-5
      juniper_csrx: *crpd
      juniper_vjunosevolved: &vm-4-9-juniper
        requests: {cpu: "4", memory: 9Gi}
      juniper_vjunosrouter: &vjunos
        requests: {cpu: "4", memory: 6Gi}
      juniper_vjunosswitch: *vjunos
      juniper_vmx: &vm-4-7
        requests: {cpu: "4", memory: 7Gi}
      vr-vmx: *vm-4-7
      vr-juniper_vmx: *vm-4-7
      juniper_vqfx: &vqfx
        requests: {cpu: "2", memory: 5Gi}
      vr-vqfx: *vqfx
      vr-juniper_vqfx: *vqfx
      juniper_vsrx: &vsrx
        requests: {cpu: "2", memory: 5Gi}
      vr-vsrx: *vsrx
      vr-juniper_vsrx: *vsrx
      keysight_ixia-c-one: *native-medium
      linux: &linux
        requests: {cpu: 250m, memory: 512Mi}
      mikrotik_chr: &routeros
        requests: {cpu: "1", memory: 512Mi}
      mikrotik_ros: &routeros-vm
        requests: {cpu: "1", memory: 512Mi}
      vr-ros: *routeros-vm
      vr-mikrotik_ros: *routeros-vm
      nokia_srlinux: &srl
        requests: {cpu: "2", memory: 2Gi}
      srl: *srl
      nokia_sros: &sros
        requests: {cpu: "2", memory: 5Gi}
      vr-sros: *sros
      vr-nokia_sros: *sros
      nokia_srsim: &srsim
        requests: {cpu: "4", memory: 8Gi}
      nvidia_cumulusvx: &vm-2-5-cumulus
        requests: {cpu: "2", memory: 5Gi}
      openwrt: *routeros
      paloalto_panos: &vm-2-7
        requests: {cpu: "2", memory: 7Gi}
      vr-pan: *vm-2-7
      vr-paloalto_panos: *vm-2-7
      plvision_sonic: &vm-2-5-plvision
        requests: {cpu: "2", memory: 5Gi}
      rare: *light
      sonic-vm: *vm-2-5
      sonic-vs: *native-medium
      spirent_stc: *native-medium
      tailscale: *linux
      veesix_osvbng: &veesix
        requests: {cpu: "1", memory: 2Gi}
      vyosnetworks_vyos: &vm-1-5-vyos
        requests: {cpu: "1", memory: 5Gi}

    # resourcesByImage maps RE2 regular expressions to primary-container resource defaults.
    # Expressions match the complete source image reference and must have exactly one match per
    # image; invalid or ambiguous configuration fails reconciliation. Image rules override kind
    # and generic defaults, while explicit NodeProfiles override all global defaults.
    resourcesByImage: {}

    # nodeSelectorsByImage is a mapping of image glob patterns (as key) and node label and value
    # pairs (as value) to apply to direct device workloads as Kubernetes NodeSelectors.
    # Note that in case of multiple matches the longest (with most characters) will take
    # precedence. E.g:
    # {
    #  "internal.io/nokia_sros*": {"node-flavour": "baremetal"},
    #  "ghcr.io/nokia/srlinux*":  {"node-flavour": "amd64"},
    #  "default":                 {"node-flavour": "cheap"},
    # }
    # The "nodeSelectorsByImage" key holds a map[string]map[string]string.
    nodeSelectorsByImage: {}

    # containerStopSignals, when true, has the direct-pod renderer map an image's OCI stop signal
    # to the Kubernetes lifecycle.stopSignal field. This requires the cluster (apiserver and
    # kubelets) to enable the ContainerStopSignals feature gate; c9s cannot enable it for you.
    # When false, images that declare a stop signal fail planning rather than silently dropping
    # the signal.
    containerStopSignals: false

#
# clicker
#
# this is an optional feature that can configure nodes in a cluster -- useful for setting things
# like ulimit and such.
#
clicker:
  enabled: false

  # pass in the "global" values to the sub chart, you can still override them, but this keeps things
  # more aligned while still being easy to override
  appName: *_appName
  globalAnnotations: *_globalAnnotations
  globalLabels: *_globalLabels

  # other values to pass to clicker go here if ya want
